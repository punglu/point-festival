server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===== nginx 버전 정보 노출 차단 =====
    server_tokens off;

    # ===== Security Headers =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    # ===== dotfile 접근 차단 (.env, .git 등) =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== 소스맵 차단 =====
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== API Proxy =====
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ===== index.html — 캐시 금지 (SPA 배포 시 항상 최신 버전) =====
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # ===== Favicon / PWA manifest — content-hash 없으므로 캐시 금지 =====
    location ~* ^/(favicon|apple-touch-icon|og-image|manifest) {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ===== SPA Fallback =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== Static Asset Cache (Vite content-hash 포함 파일 — 영구 캐시) =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
