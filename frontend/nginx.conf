# MONGLE-W3-WAGLE-REALTIME-PUSH-RECOVERY-PIN-001: WebSocket upgrade support.
# nginx drops hop-by-hop headers by default, so without this map the Wagle
# realtime handshake never reaches the backend and the browser sees an
# ordinary close (1006) rather than the gateway's own answer. That looked
# exactly like a flaky network and drove the client into its reconnect loop.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Wagle Service ingress only — 32KB 애플리케이션 레벨 제한(R2-B2)의 proxy 측
    # 보강. 이 경로에만 적용되며 다른 /api/ 경로나 향후 첨부파일 API에는
    # 영향을 주지 않는다.
    #
    # MONGLE-W3-WAGLE-REALTIME-PUSH-RECOVERY-PIN-001: the path still carried the
    # retired messaging name, so migration 0007's rename left this rule matching
    # a prefix the backend answers 404 for — the 32KB proxy-side cap silently
    # stopped applying to the route it exists to protect.
    location ~ ^/api/families/[^/]+/wagle/service/actions$ {
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Wagle realtime WebSocket. Declared before the generic /api/ block so the
    # upgrade headers are applied to it specifically; the long read timeout is
    # the idle-connection budget, not a request timeout.
    location = /api/me/wagle/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # index.html은 항상 최신 버전 (SPA 배포 시 캐시 방지)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — content-hash가 없고 갱신이 즉시 반영돼야 하므로 캐시 금지.
    # 캐시되면 구버전 worker가 남아 Push 동작이 소스와 어긋난다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Favicon / PWA manifest — content-hash 없으므로 캐시 금지
    location ~* ^/(favicon|apple-touch-icon|og-image|manifest) {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # 해시 포함 정적 자산은 영구 캐시 (Vite content-hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
