<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>마인크래프트 포인트 잔치 v1.9.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Black+Han+Sans&display=swap');

    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #10b981;
      --blue: #3b82f6;
      --text: #1e293b;
      --muted: #64748b;
      --gold: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      --input-bg: #f1f5f9;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.5rem;
      color: var(--text);
      margin: 0;
    }

    /* 레이아웃 */
    .top-section {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    /* [수정] 2단 배열 고정 및 넘침 방지 */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 100%;
    }

    /* Grid 자식이 overflow를 제어할 수 있게 min-width: 0 설정 */
    .player-grid>section {
      min-width: 0;
    }

    @media (max-width: 900px) {

      .top-section,
      .player-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card);
      border-radius: 24px;
      padding: 25px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }

    /* [v1.9.2 신규] 텍스트 말줄임 및 호버 효과 클래스 */
    .text-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      /* 최대 2줄 */
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.3s ease;
      cursor: help;
      /* 마우스 오버 가능 표시 */
    }

    .text-clamp:hover {
      -webkit-line-clamp: unset;
      /* 호버 시 전체 보이기 */
      overflow: visible;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      padding: 2px;
      z-index: 10;
      position: relative;
    }

    /* 부모님 말풍선 */
    .parent-msg-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 15px;
    }

    .parent-photo {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex-shrink: 0;
      background: #eee;
    }

    .parent-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble {
      position: relative;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 0.9rem;
      border: 1px solid transparent;
      flex: 1;
      line-height: 1.4;
    }

    .bubble.dad {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #dbeafe;
    }

    .bubble.mom {
      background: #fdf2f8;
      color: #be185d;
      border-color: #fce7f3;
    }

    .bubble.player {
      background: #f8fafc;
      color: #475569;
      border-color: #e2e8f0;
      margin-top: 10px;
    }

    .bubble::after {
      content: '';
      position: absolute;
      top: 15px;
      left: -8px;
      border-width: 8px 8px 8px 0;
      border-style: solid;
      border-color: transparent inherit transparent transparent;
    }

    /* 아이들 상태 메시지 (Input) */
    .status-bubble-input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      border-top-left-radius: 4px;
      font-family: 'Pretendard';
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
      transition: 0.2s;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .status-bubble-input:focus {
      border-color: var(--accent);
      outline: none;
      background: #f0fdf4;
    }

    /* 답글 스타일 */
    .reply-box {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .reply-item {
      font-size: 0.85rem;
      background: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      display: flex;
      gap: 5px;
      align-items: flex-start;
    }

    .reply-sender {
      font-weight: 800;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .reply-sender.아빠 {
      color: var(--blue);
    }

    .reply-sender.엄마 {
      color: #db2777;
    }

    /* 미션 리스트 */
    .m-item {
      background: #fff;
      margin-bottom: 12px;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid #f1f5f9;
      position: relative;
      transition: 0.3s;
    }

    .m-item.completed {
      border-left: 6px solid var(--accent);
      background: linear-gradient(135deg, #fafffd 0%, #ffffff 100%);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
    }

    .m-item.failed {
      border-left: 6px solid var(--danger);
      background: #fffafb;
      opacity: 0.8;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .tag-active {
      background: #eff6ff;
      color: #2563eb;
    }

    .tag-done {
      background: #ecfdf5;
      color: #059669;
    }

    .tag-fail {
      background: #fef2f2;
      color: #dc2626;
    }

    /* UI 요소 */
    .btn {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      padding: 12px 20px;
    }

    .btn-ghost {
      background: var(--input-bg);
      color: var(--muted);
      padding: 8px 12px;
      font-size: 0.8rem;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 0.5;
      padding: 0 5px;
    }

    .btn-icon:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .photo-area {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: #f1f5f9;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex-shrink: 0;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    input,
    select {
      background: var(--input-bg);
      border: 2px solid transparent;
      padding: 10px 14px;
      border-radius: 12px;
      outline: none;
    }

    .stat-card {
      padding: 12px;
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
    }

    .order-btns {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .btn-updown {
      background: #fff;
      border: 1px solid #e2e8f0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
    }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 5000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #f1f5f9;
      gap: 10px;
    }

    .checklist-item input {
      width: 20px;
      height: 20px;
    }

    .sender-radios {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 0.8rem;
    }

    .sender-radios label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body>

  <div id="login-overlay">
    <div class="panel" style="width: 300px; text-align: center;">
      <h3>🛡️ 관리자 인증</h3>
      <input type="password" id="adminPwd" placeholder="비밀번호"
        style="width: 100%; box-sizing: border-box; margin-bottom: 16px;">
      <button class="btn btn-primary" style="width: 100%" onclick="tryLogin()">접속</button>
    </div>
  </div>

  <div id="archive-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modal-title" style="margin:0; color:var(--blue);">🏆 성취 기록</h3>
      <div id="modal-body"></div>
      <button class="btn btn-primary" style="width:100%"
        onclick="document.getElementById('archive-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div id="action-modal" class="modal">
    <div class="modal-content">
      <h3 id="action-title" style="margin:0;">작업 선택</h3>
      <div style="background:var(--input-bg); padding:10px; border-radius:12px;">
        <label style="font-size:0.8rem; color:var(--muted); font-weight:700;">대상 어린이:</label>
        <select id="modal-player-select" style="width:100%; margin-top:5px; background:white;"></select>
      </div>
      <div id="action-list" style="max-height:300px; overflow-y:auto;"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="action-confirm-btn" style="flex:1">실행</button>
        <button class="btn btn-ghost" onclick="document.getElementById('action-modal').style.display='none'"
          style="flex:1">취소</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <header>
      <h1 id="app-title">마인크래프트 포인트 잔치</h1>
      <div id="mode-text" style="color: var(--muted); font-size: 0.9rem; margin-top: 8px; font-weight: 600;">
        <span id="auth-btn" style="cursor:pointer; text-decoration: underline;"
          onclick="document.getElementById('login-overlay').style.display='flex'">관리자 로그인</span>
      </div>
    </header>

    <section class="top-section">
      <div class="panel">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 10px;">📅 DATE SELECTOR
        </div>
        <div
          style="position: relative; background: var(--input-bg); padding: 15px; border-radius: 16px; text-align: center;">
          <span id="dateText" style="font-size: 1.2rem; font-weight: 800; color: var(--blue);">2026-02-15</span>
          <input type="date" id="viewDate" onchange="handleDateChange(this.value)">
        </div>
        <div style="display: flex; gap: 6px; margin-top: 10px;">
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(-1)">어제</button>
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(0)">오늘</button>
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(1)">내일</button>
        </div>
      </div>

      <div class="panel" style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 5px;">📢 PARENTS' CHEER UP
        </div>
        <div class="parent-msg-box">
          <div class="parent-photo" onclick="triggerParentPhoto('dad')"><img id="photo-dad" src=""></div>
          <div id="cheer-dad" class="bubble dad text-clamp" style="display: none;"><span></span></div>
        </div>
        <div class="parent-msg-box">
          <div class="parent-photo" onclick="triggerParentPhoto('mom')"><img id="photo-mom" src=""></div>
          <div id="cheer-mom" class="bubble mom text-clamp" style="display: none;"><span></span></div>
        </div>
        <div id="admin-cheer-zone"
          style="display: none; padding-top: 10px; border-top: 1px dashed #eee; flex-direction: column; gap: 8px;">
          <div style="display: flex; gap: 5px;">
            <input type="text" id="dadMsgIn" placeholder="아빠 메시지" style="flex:1">
            <button class="btn btn-primary" onclick="saveCheer('dad')">저장</button>
            <button class="btn btn-ghost" style="color:red" onclick="deleteCheer('dad')">X</button>
          </div>
          <div style="display: flex; gap: 5px;">
            <input type="text" id="momMsgIn" placeholder="엄마 메시지" style="flex:1">
            <button class="btn btn-primary" style="background:#be185d" onclick="saveCheer('mom')">저장</button>
            <button class="btn btn-ghost" style="color:red" onclick="deleteCheer('mom')">X</button>
          </div>
        </div>
      </div>
    </section>

    <div id="admin-panel" class="panel"
      style="display: none; flex-direction: column; gap: 15px; border: 2px solid var(--accent);">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight: 800; color: var(--accent);">🛠️ QUEST CONTROL</div>
        <div style="display:flex; gap:5px;">
          <button class="btn btn-ghost" style="background:#e8f5e9; color:#2e7d32; font-size:0.8rem;"
            onclick="openCopyModal()">♻️ 복제</button>
          <button class="btn btn-ghost" style="background:#fee2e2; color:#ef4444; font-size:0.8rem;"
            onclick="openBatchDeleteModal()">🗑️ 삭제</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
        <select id="targetKid"></select>
        <select id="missionSender">
          <option value="아빠">아빠</option>
          <option value="엄마">엄마</option>
        </select>
        <input type="text" id="missionText" placeholder="미션 제목">
        <input type="number" id="missionPoint" placeholder="EXP" style="width: 80px">
        <input type="text" id="missionMsg" placeholder="말풍선 메시지">
        <button class="btn btn-primary" onclick="addMission()">하달</button>
      </div>
      <div id="kid-admin-zone" style="padding-top: 10px; border-top: 1px dashed #eee; display: flex; gap: 10px;">
        <input type="text" id="newKidName" placeholder="아이 이름 등록" style="flex: 1">
        <button class="btn btn-primary" style="padding: 0 20px;" onclick="registerKid()">등록</button>
      </div>
    </div>

    <main id="player-grid" class="player-grid"></main>
  </div>

  <input type="file" id="photoInput" style="display:none;" accept="image/*">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const TEXT_CONFIG = {
      appTitle: "마인크래프트 포인트 잔치",
      statTotal: "Total",
      statAllocated: "오늘의 배정",
      statDone: "완수",
      statRemaining: "남은 미션",
      msgPlaceholder: "답장 보내기..."
    };

    document.getElementById('app-title').innerText = TEXT_CONFIG.appTitle;

    const firebaseConfig = {
      apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
      authDomain: "mark-point-festivals.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
      projectId: "mark-point-festivals",
      storageBucket: "mark-point-festivals.firebasestorage.app",
      messagingSenderId: "87999590531",
      appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const refs = {
      players: ref(db, 'mc_players/'),
      data: ref(db, 'mc_mission_data/'),
      cheer: ref(db, 'mc_cheer_msgs/'),
      config: ref(db, 'mc_config/'),
      feedback: ref(db, 'mc_feedbacks/')
    };

    let state = { players: {}, missions: {}, cheers: {}, config: {}, feedbacks: {} };
    let isAdmin = sessionStorage.getItem('isAdmin') === 'true';
    let global = { targetPhotoType: null, editMissionId: null, lastCompletedCount: {}, currentModalMode: null };

    window.tryLogin = () => {
      if (document.getElementById('adminPwd').value === 'admin1234') {
        sessionStorage.setItem('isAdmin', 'true');
        location.href = '?admin=true';
      } else alert('권한이 없습니다.');
    };

    if (location.search.includes('admin=true') || isAdmin) {
      isAdmin = true; sessionStorage.setItem('isAdmin', 'true');
      document.getElementById('admin-panel').style.display = 'flex';
      document.getElementById('admin-cheer-zone').style.display = 'flex';
      document.getElementById('auth-btn').innerText = '관리자 로그아웃';
      document.getElementById('auth-btn').onclick = () => { sessionStorage.clear(); location.href = '?'; };
    }

    const getKSTDate = (date = new Date()) => {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().split('T')[0];
    };
    document.getElementById('viewDate').value = getKSTDate();
    document.getElementById('dateText').innerText = getKSTDate();

    onValue(refs.players, (snap) => { state.players = snap.val() || {}; render(); updateAdminSelect(); });
    onValue(refs.data, (snap) => {
      state.missions = snap.val() || {};
      checkConfettiTrigger();
      render();
    });
    onValue(refs.cheer, (snap) => { state.cheers = snap.val() || {}; updateCheerDisplay(); });
    onValue(refs.config, (snap) => { state.config = snap.val() || {}; updateConfigUI(); });
    onValue(refs.feedback, (snap) => { state.feedbacks = snap.val() || {}; render(); });

    function checkConfettiTrigger() {
      const date = document.getElementById('viewDate').value;
      Object.entries(state.missions).forEach(([pId, dates]) => {
        const mList = dates[date]?.missions || {};
        const completedCount = Object.values(mList).filter(m => m.status === 'completed').length;
        if (global.lastCompletedCount[pId] !== undefined && completedCount > global.lastCompletedCount[pId]) {
          fireConfetti();
        }
        global.lastCompletedCount[pId] = completedCount;
      });
    }

    function fireConfetti() {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 6000 });
    }

    window.triggerParentPhoto = (type) => { if (!isAdmin) return; global.targetPhotoType = type; document.getElementById('photoInput').click(); };
    window.triggerKidPhoto = (pId) => { if (!isAdmin) return; global.targetPhotoType = 'kid:' + pId; document.getElementById('photoInput').click(); };

    document.getElementById('photoInput').onchange = (e) => {
      const file = e.target.files[0];
      if (file && global.targetPhotoType) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (global.targetPhotoType.startsWith('kid:')) {
            update(ref(db, `mc_players/${global.targetPhotoType.split(':')[1]}`), { photo: ev.target.result });
          } else {
            update(ref(db, `mc_config/photos`), { [global.targetPhotoType]: ev.target.result });
          }
        };
        reader.readAsDataURL(file);
      }
    };

    function updateConfigUI() {
      const photos = state.config.photos || {};
      if (photos.dad) document.getElementById('photo-dad').src = photos.dad;
      if (photos.mom) document.getElementById('photo-mom').src = photos.mom;
    }

    window.updateStatusMsg = (pId, msg) => {
      update(ref(db, `mc_players/${pId}`), { statusMsg: msg });
    };

    function renderChecklist(missionsObj, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!missionsObj || Object.keys(missionsObj).length === 0) return container.innerHTML = '<div style="color:#999; text-align:center; padding:10px;">데이터가 없습니다.</div>';

      Object.entries(missionsObj).forEach(([id, m]) => {
        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `<input type="checkbox" value="${id}" checked> <span style="font-size:0.9rem;">${m.text} (${m.point}P)</span>`;
        container.appendChild(div);
      });
    }

    document.getElementById('modal-player-select').onchange = async (e) => {
      const pId = e.target.value;
      const date = document.getElementById('viewDate').value;
      if (global.currentModalMode === 'COPY') {
        const d = new Date(date); d.setDate(d.getDate() - 1);
        const yesterday = getKSTDate(d);
        const snapshot = await get(ref(db, `mc_mission_data/${pId}/${yesterday}/missions`));
        renderChecklist(snapshot.val(), 'action-list');
      } else if (global.currentModalMode === 'DELETE') {
        const missions = state.missions[pId]?.[date]?.missions;
        renderChecklist(missions, 'action-list');
      }
    };

    function initModalPlayerSelect() {
      const select = document.getElementById('modal-player-select');
      select.innerHTML = Object.entries(state.players).map(([id, p]) => `<option value="${id}">${p.name}</option>`).join('');
      const mainTarget = document.getElementById('targetKid').value;
      if (mainTarget) select.value = mainTarget;
      return select.value;
    }

    window.openCopyModal = async () => {
      global.currentModalMode = 'COPY';
      const pId = initModalPlayerSelect();
      const today = document.getElementById('viewDate').value;
      const d = new Date(today); d.setDate(d.getDate() - 1);
      const yesterday = getKSTDate(d);

      const snapshot = await get(ref(db, `mc_mission_data/${pId}/${yesterday}/missions`));
      const yMissions = snapshot.val();

      document.getElementById('action-title').innerText = `${yesterday} 미션 가져오기`;
      renderChecklist(yMissions, 'action-list');

      document.getElementById('action-confirm-btn').onclick = async () => {
        const selectedPid = document.getElementById('modal-player-select').value;
        const snap = await get(ref(db, `mc_mission_data/${selectedPid}/${yesterday}/missions`));
        const freshMissions = snap.val() || {};
        document.querySelectorAll('#action-list input:checked').forEach(cb => {
          const m = freshMissions[cb.value];
          if (m) push(ref(db, `mc_mission_data/${selectedPid}/${today}/missions`), { ...m, status: 'active', createdAt: Date.now() });
        });
        document.getElementById('action-modal').style.display = 'none';
      };
      document.getElementById('action-modal').style.display = 'flex';
    };

    window.openBatchDeleteModal = () => {
      global.currentModalMode = 'DELETE';
      const pId = initModalPlayerSelect();
      const date = document.getElementById('viewDate').value;
      const tMissions = state.missions[pId]?.[date]?.missions;

      document.getElementById('action-title').innerText = "일괄 삭제할 미션 선택";
      renderChecklist(tMissions, 'action-list');

      document.getElementById('action-confirm-btn').onclick = () => {
        const selectedPid = document.getElementById('modal-player-select').value;
        if (confirm('선택한 미션을 삭제하시겠습니까?')) {
          document.querySelectorAll('#action-list input:checked').forEach(cb => {
            remove(ref(db, `mc_mission_data/${selectedPid}/${date}/missions/${cb.value}`));
          });
        }
        document.getElementById('action-modal').style.display = 'none';
      };
      document.getElementById('action-modal').style.display = 'flex';
    };

    window.saveCheer = (type) => {
      const date = document.getElementById('viewDate').value;
      const msg = document.getElementById(type + 'MsgIn').value;
      if (msg) set(ref(db, `mc_cheer_msgs/${date}/${type}`), msg);
      document.getElementById(type + 'MsgIn').value = '';
    };
    window.deleteCheer = (type) => {
      const date = document.getElementById('viewDate').value;
      remove(ref(db, `mc_cheer_msgs/${date}/${type}`));
    };
    function updateCheerDisplay() {
      const date = document.getElementById('viewDate').value;
      const dayCheer = state.cheers[date] || {};
      const dad = document.getElementById('cheer-dad');
      const mom = document.getElementById('cheer-mom');
      if (dayCheer.dad) { dad.style.display = 'block'; dad.querySelector('span').innerText = dayCheer.dad; } else dad.style.display = 'none';
      if (dayCheer.mom) { mom.style.display = 'block'; mom.querySelector('span').innerText = dayCheer.mom; } else mom.style.display = 'none';
    }

    window.updateKidName = (pId) => {
      if (!isAdmin) return;
      const newName = prompt("이름 변경:", state.players[pId].name);
      if (newName) update(ref(db, `mc_players/${pId}`), { name: newName });
    };

    window.toggleEdit = (mId) => { global.editMissionId = (global.editMissionId === mId) ? null : mId; render(); };
    window.saveMissionEdit = (pId, date, mId) => {
      const text = document.getElementById(`edit-text-${mId}`).value;
      const point = parseInt(document.getElementById(`edit-point-${mId}`).value);
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { text, point });
      global.editMissionId = null;
    };

    window.deleteMission = (pId, date, mId) => { if (confirm('이 미션을 영구 삭제하시겠습니까?')) remove(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`)); };

    window.addMission = () => {
      const pId = document.getElementById('targetKid').value;
      const date = document.getElementById('viewDate').value;
      const text = document.getElementById('missionText').value;
      const point = document.getElementById('missionPoint').value;

      if (!pId) return alert("플레이어를 선택해주세요.");
      if (!text) return alert("내용을 입력해주세요.");

      const nextOrder = Object.keys(state.missions[pId]?.[date]?.missions || {}).length;

      const mData = {
        text: text,
        point: parseInt(point) || 0,
        sender: document.getElementById('missionSender').value,
        msg: document.getElementById('missionMsg').value,
        status: 'active',
        order: nextOrder,
        createdAt: Date.now()
      };

      push(ref(db, `mc_mission_data/${pId}/${date}/missions`), mData).then(() => {
        document.getElementById('missionText').value = '';
        document.getElementById('missionMsg').value = '';
        document.getElementById('missionText').focus();
      });
    };

    window.setMissionStatus = (pId, date, mId, status, point = 0) => {
      const currentStatus = state.missions[pId][date].missions[mId].status;
      if (status === 'completed' && currentStatus !== 'completed') {
        update(ref(db, `mc_players/${pId}`), { totalPoints: (state.players[pId].totalPoints || 0) + point });
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      } else if (currentStatus === 'completed' && status !== 'completed') {
        update(ref(db, `mc_players/${pId}`), { totalPoints: Math.max(0, (state.players[pId].totalPoints || 0) - point) });
      }
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status });
    };

    window.moveOrder = (pId, date, mId, direction) => {
      const mList = Object.entries(state.missions[pId][date].missions).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
      const idx = mList.findIndex(x => x[0] === mId);
      if (direction === 'up' && idx > 0) {
        update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx][0]}`), { order: mList[idx - 1][1].order });
        update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx - 1][0]}`), { order: mList[idx][1].order });
      } else if (direction === 'down' && idx < mList.length - 1) {
        update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx][0]}`), { order: mList[idx + 1][1].order });
        update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx + 1][0]}`), { order: mList[idx][1].order });
      }
    };

    window.registerKid = () => {
      const name = document.getElementById('newKidName').value;
      if (!name) return;
      push(playerRef, { name: name, totalPoints: 0, photo: "" });
      document.getElementById('newKidName').value = '';
    };

    window.fixPlayerScore = (pId) => {
      if (!isAdmin) return;
      const cur = state.players[pId].totalPoints || 0;
      const newVal = prompt(`점수 강제 수정:`, cur);
      if (newVal !== null) set(ref(db, `mc_players/${pId}/totalPoints`), parseInt(newVal));
    };

    window.showArchive = (pId) => {
      const date = document.getElementById('viewDate').value;
      const pMs = state.missions[pId]?.[date]?.missions || {};
      const completed = Object.values(pMs).filter(m => m.status === 'completed');
      document.getElementById('modal-title').innerText = `${state.players[pId].name}의 완료 기록 (${date})`;
      document.getElementById('modal-body').innerHTML = completed.length
        ? completed.map(m => `<div style="padding:12px; border-bottom:1px solid #f1f1f1; display:flex; justify-content:space-between;"><span>✅ ${m.text}</span><span style="color:var(--blue); font-weight:700;">+${m.point}P</span></div>`).join('')
        : '<div style="padding:30px; text-align:center; color:#ccc;">완료 미션 없음</div>';
      document.getElementById('archive-modal').style.display = 'flex';
    };

    window.sendFeedback = (pId) => {
      const date = document.getElementById('viewDate').value;
      const msg = document.getElementById(`feedback-in-${pId}`).value;
      if (!msg) return;
      push(ref(db, `mc_feedbacks/${pId}/${date}`), { msg, createdAt: Date.now() });
      document.getElementById(`feedback-in-${pId}`).value = '';
    };

    window.deleteFeedback = (pId, date, fbId) => { if (confirm('삭제?')) remove(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}`)); };
    window.editFeedback = (pId, date, fbId, current) => {
      const newMsg = prompt("수정:", current);
      if (newMsg && newMsg !== current) update(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}`), { msg: newMsg });
    };
    window.toggleReplyForm = (fbId) => {
      const el = document.getElementById(`reply-form-${fbId}`);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };
    window.addReply = (pId, date, fbId) => {
      const replyText = document.getElementById(`reply-in-${fbId}`).value;
      const sender = document.querySelector(`input[name="sender-${fbId}"]:checked`).value;
      if (!replyText) return;
      push(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}/replies`), { text: replyText, sender, createdAt: Date.now() });
      document.getElementById(`reply-in-${fbId}`).value = '';
      toggleReplyForm(fbId);
    };

    window.handleDateChange = (date) => {
      document.getElementById('dateText').innerText = date;
      updateCheerDisplay();
      render();
    };
    window.quickDateChange = (days) => {
      let d = (days === 0) ? new Date() : new Date(document.getElementById('viewDate').value);
      if (days !== 0) d.setDate(d.getDate() + days);
      const newDate = getKSTDate(d);
      document.getElementById('viewDate').value = newDate;
      handleDateChange(newDate);
    };

    function updateAdminSelect() {
      const select = document.getElementById('targetKid');
      if (select) {
        const current = select.value;
        select.innerHTML = Object.entries(state.players).map(([id, p]) => `<option value="${id}">${p.name}</option>`).join('');
        if (!current && Object.keys(state.players).length > 0) select.value = Object.keys(state.players)[0];
        else if (current && state.players[current]) select.value = current;
      }
    }

    function render() {
      const grid = document.getElementById('player-grid');
      const date = document.getElementById('viewDate').value;
      grid.innerHTML = '';

      Object.entries(state.players).forEach(([pId, p]) => {
        const mList = state.missions[pId]?.[date]?.missions || {};
        const mEntries = Object.entries(mList).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
        const dayFeedback = state.feedbacks[pId]?.[date] || {};

        const totalAllocated = mEntries.reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
        const donePoints = mEntries.filter(m => m[1].status === 'completed').reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
        const failedPoints = mEntries.filter(m => m[1].status === 'failed').reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
        const pendingPoints = Math.max(0, totalAllocated - donePoints - failedPoints);

        const section = document.createElement('section');
        section.className = 'panel';
        section.innerHTML = `
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
            <div class="photo-area" onclick="triggerKidPhoto('${pId}')">
                ${p.photo ? `<img src="${p.photo}">` : '<div style="font-size:0.6rem; color:#64748b; padding:20px; text-align:center;">📷</div>'}
            </div>
            <div style="flex:1">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="font-family:'Black Han Sans'; font-size:1.5rem; margin:0; cursor:${isAdmin ? 'pointer' : 'default'}" onclick="updateKidName('${pId}')">${p.name}</h2>
                    ${isAdmin ? `
                        <div style="font-size:0.7rem; color:var(--gold); font-weight:800; cursor:pointer;" onclick="fixPlayerScore('${pId}')">
                             ${TEXT_CONFIG.statTotal}: ${p.totalPoints || 0}P (수정)
                        </div>
                    ` : ''}
                </div>
                <input class="status-bubble-input" value="${p.statusMsg || ''}" placeholder="오늘의 다짐!" onchange="updateStatusMsg('${pId}', this.value)">
            </div>
          </div>
          
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:24px;">
            <div class="stat-card" style="background:#f1f5f9;">
                <div style="font-size:1.1rem; font-weight:800;">${totalAllocated}</div>
                <div style="font-size:0.6rem; font-weight:700; color:var(--muted);">${TEXT_CONFIG.statAllocated}</div>
            </div>
            <div class="stat-card" style="background:#ecfdf5; color:var(--accent);" onclick="showArchive('${pId}')">
                <div style="font-size:1.1rem; font-weight:800;">${donePoints}</div>
                <div style="font-size:0.6rem; font-weight:700;">${TEXT_CONFIG.statDone}</div>
            </div>
            <div class="stat-card" style="background:#eff6ff; color:var(--blue);">
                <div style="font-size:1.1rem; font-weight:800;">${pendingPoints}</div>
                <div style="font-size:0.6rem; font-weight:700;">${TEXT_CONFIG.statRemaining}</div>
            </div>
          </div>

          <div class="m-list">
            ${mEntries.map(([mId, m]) => {
          const isEditing = global.editMissionId === mId;
          const bubbleClass = m.sender === '엄마' ? 'mom' : 'dad';
          return `
                <div class="m-item ${m.status} ${isEditing ? 'editing' : ''}">
                    <div class="tag ${m.status === 'active' ? 'tag-active' : m.status === 'completed' ? 'tag-done' : 'tag-fail'}">
                        ${m.status === 'active' ? '● 진행 중' : m.status === 'completed' ? '✅ 완료' : '🚫 실패'}
                    </div>
                    ${isEditing ? `
                        <input type="text" id="edit-text-${mId}" value="${m.text}" style="width:100%; margin-bottom:8px; box-sizing:border-box">
                        <div style="display:flex; gap:6px;">
                          <input type="number" id="edit-point-${mId}" value="${m.point}" style="width:60px;">
                          <button class="btn btn-primary" style="padding:0 12px; font-size:0.75rem;" onclick="saveMissionEdit('${pId}','${date}','${mId}')">저장</button>
                          <button class="btn btn-ghost" onclick="toggleEdit('${mId}')">취소</button>
                        </div>
                    ` : `
                        <div style="font-weight:700; font-size:1.05rem; margin-bottom:4px;">${m.text} (+${m.point}P)</div>
                    `}
                    ${m.msg ? `<div class="bubble ${bubbleClass} text-clamp" style="margin-top:8px; font-size:0.8rem;"><b>${m.sender}:</b> ${m.msg}</div>` : ''}
                    
                    ${isAdmin ? `
                        <div class="order-btns">
                            <button class="btn-updown" onclick="moveOrder('${pId}','${date}','${mId}','up')">▲</button>
                            <button class="btn-updown" onclick="moveOrder('${pId}','${date}','${mId}','down')">▼</button>
                        </div>
                        <div style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                            ${m.status === 'active'
                ? `<button class="btn btn-primary" onclick="setMissionStatus('${pId}','${date}','${mId}','completed',${m.point})">승인</button>
                                   <button class="btn btn-ghost" onclick="toggleEdit('${mId}')">수정</button>`
                : `<button class="btn btn-primary" style="background:var(--gold); grid-column: span 2" onclick="setMissionStatus('${pId}','${date}','${mId}','active',${m.point})">복구</button>`}
                        </div>
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <button class="btn btn-ghost" style="flex:1" onclick="toggleEdit('${mId}')">수정</button>
                            <button class="btn btn-ghost" style="flex:1; color:var(--danger)" onclick="deleteMission('${pId}', '${date}', '${mId}')">영구 삭제</button>
                        </div>
                    ` : ''}
                </div>`
        }).join('')}
          </div>
          
          <div style="margin-top:20px;">
            ${Object.entries(dayFeedback).map(([fbId, fb]) => `
                <div class="bubble player text-clamp">
                    <div style="display:flex; justify-content:space-between;">
                        <span><b>${p.name}:</b> ${fb.msg}</span>
                        ${isAdmin ? `
                            <div style="flex-shrink:0;">
                                <button class="btn-icon" onclick="editFeedback('${pId}', '${date}', '${fbId}', '${fb.msg}')">✏️</button>
                                <button class="btn-icon" onclick="deleteFeedback('${pId}', '${date}', '${fbId}')">🗑️</button>
                                <button class="btn-icon" onclick="toggleReplyForm('${fbId}')">↩️</button>
                            </div>
                        ` : ''}
                    </div>
                    ${fb.replies ? `<div class="reply-box">
                        ${Object.values(fb.replies).map(r => `
                            <div class="reply-item text-clamp">
                                <span class="reply-sender ${r.sender}">${r.sender}:</span> ${r.text}
                            </div>
                        `).join('')}
                    </div>` : ''}
                    <div id="reply-form-${fbId}" style="display:none; margin-top:8px;">
                        <div class="sender-radios">
                            <label><input type="radio" name="sender-${fbId}" value="아빠" checked> 👨 아빠</label>
                            <label><input type="radio" name="sender-${fbId}" value="엄마"> 👩 엄마</label>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <input type="text" id="reply-in-${fbId}" placeholder="답글..." style="flex:1; padding:5px;">
                            <button class="btn btn-primary" style="padding:0 10px; font-size:0.7rem;" onclick="addReply('${pId}','${date}','${fbId}')">등록</button>
                        </div>
                    </div>
                </div>
            `).join('')}
          </div>
          
          <div style="display:flex; gap:8px; margin-top:15px;">
            <input type="text" id="feedback-in-${pId}" placeholder="${TEXT_CONFIG.msgPlaceholder}" style="flex:1; font-size:0.85rem;">
            <button class="btn btn-primary" style="width:auto; padding:0 15px; font-size:0.85rem;" onclick="sendFeedback('${pId}')">전송</button>
          </div>
        `;
        grid.appendChild(section);
      });
    }
  </script>
</body>

</html>
