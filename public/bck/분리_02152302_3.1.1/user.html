<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>마인크래프트 포인트 잔치</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div id="env-badge"
    style="display:none; position:fixed; top:0; left:0; right:0; height:5px; background:#4ade80; z-index:9999;"></div>

  <div id="login-overlay" class="modal" style="display:none; align-items:center; justify-content:center;">
    <div class="modal-content" style="text-align:center;">
      <h2 id="login-player-name" style="margin-bottom:10px;"></h2>
      <p style="color:#666; margin-bottom:20px;">PIN 번호 4자리를 입력하세요</p>
      <div class="pin-input-container">
        <input type="password" maxlength="1" class="pin-digit" id="pin1" inputmode="numeric" pattern="[0-9]">
        <input type="password" maxlength="1" class="pin-digit" id="pin2" inputmode="numeric" pattern="[0-9]">
        <input type="password" maxlength="1" class="pin-digit" id="pin3" inputmode="numeric" pattern="[0-9]">
        <input type="password" maxlength="1" class="pin-digit" id="pin4" inputmode="numeric" pattern="[0-9]">
      </div>
      <button class="btn btn-ghost" onclick="cancelLogin()">취소</button>
    </div>
  </div>

  <div class="app-wrapper">
    <header>
      <h1>마인크래프트 포인트 잔치</h1>
      <div style="color: var(--muted); font-size: 0.9rem; margin-top: 8px;">
        <span id="user-greeting"></span>
        <button id="logout-btn" class="btn btn-ghost"
          style="display:none; margin-left:5px; padding:4px 8px; font-size:0.7rem;" onclick="logout()">로그아웃</button>
      </div>
    </header>

    <div id="player-selector-area">
      <h3 style="text-align:center; margin-bottom:20px; color:#64748b;">오늘 미션을 시작할까요?</h3>
      <div id="player-list" style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap;"></div>
    </div>

    <main id="main-content" style="display:none;">
      <div class="panel" style="text-align:center; padding:15px;">
        <h2 id="date-display" style="color:var(--blue); font-family:'Black Han Sans'; margin-bottom:5px;"></h2>
        <input type="date" id="view-date" onchange="handleDateChange(this.value)"
          style="text-align:center; width:auto;">
      </div>

      <div id="cheer-section" class="cheer-container" style="display:none;"></div>
      <div id="dashboard"></div>

      <div class="panel" style="margin-top:20px; background:#f8fafc; border:1px solid #e2e8f0;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size:1rem; color:#475569;">👀 모두의 진행현황</h3>
          <button class="btn btn-ghost" style="font-size:0.7rem;" onclick="toggleSharedProgress()">접기/펼치기</button>
        </div>
        <div id="progress-grid" style="display:none;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    window.global = { sharedProgressExpanded: true }; // 초기값 펼침

    const isDev = window.location.hostname.includes("localhost") || window.location.hostname.includes("-dev");
    if (isDev) document.getElementById('env-badge').style.display = 'block';

    const config = isDev ? {
      apiKey: "AIzaSyBVfTiYEHTeon2zdbXEZsaDzkV0",
      authDomain: "mark-point-festivals-dev.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-dev-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mark-point-festivals-dev",
      storageBucket: "mark-point-festivals-dev.firebasestorage.app",
      messagingSenderId: "876196518434",
      appId: "1:876196518434:web:e60a09f47a910a9b79887b"
    } : {
      apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
      authDomain: "mark-point-festivals.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
      projectId: "mark-point-festivals",
      storageBucket: "mark-point-festivals.firebasestorage.app",
      messagingSenderId: "87999590531",
      appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let state = { players: {}, missions: {}, deductions: {}, cheers: {}, config: {}, feedbacks: {} };
    let currentUser = null, attemptUser = null;

    const getToday = (d = new Date()) => new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('view-date').value = getToday();
    document.getElementById('date-display').innerText = getToday();

    onValue(ref(db, 'mc_players'), s => { state.players = s.val() || {}; renderSelector(); render(); renderSharedProgress(); });
    onValue(ref(db, 'mc_mission_data'), s => { state.missions = s.val() || {}; render(); renderSharedProgress(); });
    onValue(ref(db, 'mc_deductions'), s => { state.deductions = s.val() || {}; render(); });
    onValue(ref(db, 'mc_cheer_msgs'), s => { state.cheers = s.val() || {}; renderCheer(); });
    onValue(ref(db, 'mc_config'), s => { state.config = s.val() || {}; renderCheer(); });
    onValue(ref(db, 'mc_feedbacks'), s => { state.feedbacks = s.val() || {}; render(); });

    function renderSelector() {
      document.getElementById('player-list').innerHTML = Object.entries(state.players).map(([id, p]) =>
        `<button class="btn" style="padding:20px 30px; font-size:1.1rem; background:white; border:2px solid #e2e8f0; box-shadow:0 4px 6px rgba(0,0,0,0.05);" onclick="promptLogin('${id}')">${p.name}</button>`
      ).join('');
    }

    const pins = [1, 2, 3, 4].map(i => document.getElementById(`pin${i}`));
    window.promptLogin = (id) => {
      attemptUser = id;
      document.getElementById('login-player-name').innerText = state.players[id].name;
      document.getElementById('login-overlay').style.display = 'flex';
      pins.forEach(p => p.value = '');
      document.getElementById('pin1').focus();
    };
    window.cancelLogin = () => document.getElementById('login-overlay').style.display = 'none';

    pins.forEach((el, i) => {
      el.addEventListener('input', () => { if (el.value.length === 1 && i < 3) pins[i + 1].focus(); checkPin(); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && el.value === '' && i > 0) pins[i - 1].focus(); });
    });

    async function checkPin() {
      const val = pins.map(p => p.value).join('');
      if (val.length === 4) {
        if (state.players[attemptUser].pin === val) {
          currentUser = attemptUser;
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('player-selector-area').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
          document.getElementById('logout-btn').style.display = 'inline-block';
          document.getElementById('user-greeting').innerText = `${state.players[currentUser].name}님, 환영합니다!`;

          push(ref(db, 'mc_login_history'), { playerId: currentUser, name: state.players[currentUser].name, timestamp: Date.now(), success: true });
          await checkExpiredMissions(currentUser);
          render(); renderCheer(); renderSharedProgress();
        } else {
          alert('PIN 번호 불일치');
          push(ref(db, 'mc_login_history'), { playerId: attemptUser, name: state.players[attemptUser].name, timestamp: Date.now(), success: false });
          pins.forEach(p => p.value = ''); document.getElementById('pin1').focus();
        }
      }
    }
    window.logout = () => location.reload();

    async function checkExpiredMissions(pId) {
      const today = getToday();
      const all = (await get(ref(db, `mc_mission_data/${pId}`))).val() || {};
      for (const [date, d] of Object.entries(all)) {
        if (date < today && d.missions) {
          for (const [mId, m] of Object.entries(d.missions)) {
            if (m.status === 'active' || m.status === 'pending_approval') update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status: 'failed' });
          }
        }
      }
    }

    window.handleDateChange = (val) => { document.getElementById('date-display').innerText = val; render(); renderCheer(); renderSharedProgress(); };

    function renderCheer() {
      if (!currentUser) return;
      const date = document.getElementById('view-date').value;
      const c = state.cheers[date] || {}; const p = state.config.photos || {};
      const s = "width:50px; height:50px; min-width:50px; min-height:50px; border-radius:15px; overflow:hidden; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,0.1); flex-shrink:0;";
      const is = "width:100%; height:100%; object-fit:cover; display:block;";
      let html = '';
      if (c.dad) html += `<div class="cheer-box"><div class="cheer-photo" style="${s}">${p.dad ? `<img src="${p.dad}" style="${is}">` : '👨'}</div><div class="bubble dad"><b>아빠:</b> ${c.dad}</div></div>`;
      if (c.mom) html += `<div class="cheer-box"><div class="cheer-photo" style="${s}">${p.mom ? `<img src="${p.mom}" style="${is}">` : '👩'}</div><div class="bubble mom"><b>엄마:</b> ${c.mom}</div></div>`;
      document.getElementById('cheer-section').innerHTML = html;
      document.getElementById('cheer-section').style.display = html ? 'flex' : 'none';
    }

    // [복구 완료] 모두의 진행현황
    window.toggleSharedProgress = () => {
      global.sharedProgressExpanded = !global.sharedProgressExpanded;
      renderSharedProgress();
    };

    function renderSharedProgress() {
      if (!currentUser) return;
      const date = document.getElementById('view-date').value;
      const grid = document.getElementById('progress-grid');

      if (!global.sharedProgressExpanded) {
        grid.style.display = 'none';
        return;
      }

      grid.style.display = 'grid';
      grid.innerHTML = '';

      Object.entries(state.players).forEach(([pId, p]) => {
        const mList = state.missions[pId]?.[date]?.missions || {};
        const mEntries = Object.entries(mList);

        const totalAllocated = mEntries.reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
        const completed = mEntries.filter(m => m[1].status === 'completed');
        const active = mEntries.filter(m => m[1].status === 'active');
        const failed = mEntries.filter(m => m[1].status === 'failed');

        const isCurrentUser = pId === currentUser;

        // 일일 포인트 계산 (DB totalPoints 대신 실시간 계산)
        let dailyEarned = 0; Object.values(mList).forEach(m => { if (m.status === 'completed') dailyEarned += (parseInt(m.point) || 0); });
        let dailyDeducted = 0; Object.values(state.deductions[pId]?.[date] || {}).forEach(d => { dailyDeducted += (parseInt(d.amount) || 0); });
        const currentBalance = dailyEarned - dailyDeducted;

        const card = document.createElement('div');
        card.className = `progress-card ${isCurrentUser ? 'current-user' : ''}`;
        card.innerHTML = `
            <div class="progress-header">
              <div class="progress-name">${p.name} ${isCurrentUser ? '(나)' : ''}</div>
              ${isCurrentUser ? '<div class="progress-badge">내 계정</div>' : ''}
            </div>
            
            <div class="progress-stats">
              <div class="progress-stat">
                <div class="progress-stat-value">${totalAllocated}</div>
                <div class="progress-stat-label">배정</div>
              </div>
              <div class="progress-stat" style="background:#ecfdf5;">
                <div class="progress-stat-value" style="color:var(--accent);">${completed.length}</div>
                <div class="progress-stat-label">완료</div>
              </div>
              <div class="progress-stat" style="background:#fef3c7;">
                <div class="progress-stat-value" style="color:#d97706;">${currentBalance}</div>
                <div class="progress-stat-label">잔액P</div>
              </div>
            </div>
            
            ${mEntries.length > 0 ? `
              <div class="progress-missions">
                <div style="font-size:0.7rem; font-weight:700; color:var(--muted); margin-bottom:6px;">오늘의 미션</div>
                ${completed.slice(0, 3).map(([id, m]) => `<div class="progress-mission-item completed"><span>✅ ${m.text}</span><span style="font-weight:700;">+${m.point}P</span></div>`).join('')}
                ${active.slice(0, 3).map(([id, m]) => `<div class="progress-mission-item active"><span>🔄 ${m.text}</span><span style="font-weight:700;">${m.point}P</span></div>`).join('')}
                ${failed.slice(0, 2).map(([id, m]) => `<div class="progress-mission-item failed"><span>❌ ${m.text}</span><span>0P</span></div>`).join('')}
                ${(completed.length + active.length + failed.length) > 5 ? `<div style="text-align:center; font-size:0.7rem; color:var(--muted); margin-top:6px;">외 ${(completed.length + active.length + failed.length) - 5}개 더</div>` : ''}
              </div>
            ` : '<div style="text-align:center; padding:15px; color:#ccc; font-size:0.8rem;">오늘 미션 없음</div>'}
          `;
        grid.appendChild(card);
      });
    }

    function render() {
      if (!currentUser) return;
      const date = document.getElementById('view-date').value;
      const ms = state.missions[currentUser]?.[date]?.missions || {};
      const ds = state.deductions[currentUser]?.[date] || {};
      const fbs = state.feedbacks[currentUser]?.[date] || {};

      let earned = 0; Object.values(ms).forEach(m => { if (m.status === 'completed') earned += (parseInt(m.point) || 0); });
      let deducted = 0; Object.values(ds).forEach(d => { deducted += (parseInt(d.amount) || 0); });

      let html = `
        <div class="panel">
          <div class="stat-grid">
            <div class="stat-card" style="background:#ecfdf5; color:var(--accent);"><div class="stat-val">+${earned}</div><div class="stat-label">획득</div></div>
            <div class="stat-card" style="background:#fef2f2; color:var(--danger);"><div class="stat-val">-${deducted}</div><div class="stat-label">사용</div></div>
            <div class="stat-card" style="background:#eff6ff; color:var(--blue);"><div class="stat-val">${earned - deducted}</div><div class="stat-label">잔액</div></div>
          </div>
          <h3 style="margin-bottom:15px;">📋 오늘의 미션</h3>
          <div>${Object.entries(ms).map(([mId, m]) => {
        if (m.status === 'proposed') return '';
        let t = '', b = '';
        if (m.status === 'active') { t = '<span class="tag tag-active">진행 중</span>'; b = `<button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="reqAppr('${mId}')">✅ 완료! 승인 요청</button>`; }
        else if (m.status === 'pending_approval') { t = '<span class="tag tag-pending">승인 대기</span>'; b = `<div style="text-align:center; color:#d97706; font-size:0.8rem; margin-top:8px;">부모님 확인 중... ⏳</div>`; }
        else if (m.status === 'completed') t = '<span class="tag tag-done">완료됨</span>';
        else if (m.status === 'failed') t = '<span class="tag tag-fail">실패</span>';
        else if (m.status === 'rejected') t = '<span class="tag tag-rejected">거절됨</span>';
        return `<div class="m-item ${m.status}"><div>${t} <b>${m.text} (${m.point}P)</b></div>${m.msg ? `<small style="color:#666;">💬 ${m.sender}: ${m.msg}</small>` : ''}${m.rejectionReason ? `<div style="background:#fee2e2; color:red; padding:5px; border-radius:5px; font-size:0.8rem; margin-top:5px;">❌ 이유: ${m.rejectionReason}</div>` : ''}${b}</div>`;
      }).join('') || '<div style="text-align:center; color:#999; padding:20px;">미션 없음</div>'}</div>

          <div style="margin-top:20px; border-top:1px dashed #eee; padding-top:15px;">
             <h4>💬 대화</h4>
             <div style="margin-bottom:10px;">${Object.entries(fbs).map(([fi, f]) => `<div class="bubble player"><b>나:</b> ${f.msg}${f.replies ? `<div style="margin-top:5px; border-top:1px dashed #ccc;">${Object.values(f.replies).map(r => `<div style="font-size:0.8rem;"><b>${r.sender}:</b> ${r.text}</div>`).join('')}</div>` : ''}</div>`).join('')}</div>
             <div style="display:flex; gap:8px;"><input type="text" id="fb-in" placeholder="메시지"><button class="btn btn-primary" style="width:auto;" onclick="sendFb()">전송</button></div>
          </div>

          <div style="margin-top:30px; background:#f0f9ff; padding:20px; border-radius:16px;">
            <h3 style="color:#0284c7; margin-bottom:10px;">💡 미션 제안하기</h3>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <input type="text" id="pt" placeholder="미션 이름"><input type="number" id="pp" placeholder="포인트">
              <textarea id="pr" placeholder="이유 (선택)" style="height:60px;"></textarea>
              <button class="btn btn-primary" onclick="sendProp()">제안 보내기</button>
            </div>
            <div style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
              <h4 style="font-size:0.9rem; color:#666;">내 제안 목록</h4>
              ${Object.values(ms).filter(m => m.proposedBy === 'user').map(m => `<div style="font-size:0.85rem; padding:5px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between;"><span>${m.text}</span><span>${m.status === 'proposed' ? '⏳ 검토중' : m.status === 'active' || m.status === 'completed' ? '✅ 승인됨' : '❌ 거절됨'}</span></div>`).join('') || '<small style="color:#999">없음</small>'}
            </div>
          </div>
        </div>
      `;
      document.getElementById('dashboard').innerHTML = html;
    }

    window.reqAppr = async (mId) => {
      const date = document.getElementById('view-date').value;
      const m = state.missions[currentUser][date].missions[mId];
      if (confirm('완료 승인을 요청할까요?')) {
        await update(ref(db, `mc_mission_data/${currentUser}/${date}/missions/${mId}`), { status: 'pending_approval' });
        await push(ref(db, 'mc_notifications'), { type: 'approval_request', playerId: currentUser, date, missionId: mId, message: `${state.players[currentUser].name}이(가) "${m.text}" 승인 요청!`, read: false, createdAt: Date.now() });
        alert('요청 완료!');
      }
    };
    window.sendProp = async () => {
      const t = document.getElementById('pt').value.trim(), p = parseInt(document.getElementById('pp').value), r = document.getElementById('pr').value.trim();
      if (!t || !p) return alert('입력해주세요');
      const d = getToday();
      const n = push(ref(db, `mc_mission_data/${currentUser}/${d}/missions`));
      await set(n, { text: t, point: p, proposalReason: r, status: 'proposed', proposedBy: 'user', createdAt: Date.now() });
      await push(ref(db, 'mc_notifications'), { type: 'mission_proposed', playerId: currentUser, date: d, missionId: n.key, message: `${state.players[currentUser].name} 제안: "${t}"`, read: false, createdAt: Date.now() });
      alert('제안 완료!'); document.getElementById('pt').value = ''; document.getElementById('pp').value = ''; document.getElementById('pr').value = '';
    };
    window.sendFb = async () => {
      const msg = document.getElementById('fb-in').value.trim();
      if (msg) { await push(ref(db, `mc_feedbacks/${currentUser}/${document.getElementById('view-date').value}`), { msg, createdAt: Date.now() }); document.getElementById('fb-in').value = ''; }
    };
  </script>
</body>

</html>
