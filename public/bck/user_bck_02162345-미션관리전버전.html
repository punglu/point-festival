<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>마인크래프트 포인트 잔치</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="login-overlay" class="login-overlay" style="display:none;">
    <div class="login-card">
      <h2 id="login-player-name"></h2>
      <p class="subtitle">PIN 번호를 입력하세요</p>

      <div class="pin-input-container">
        <input type="text" maxlength="1" class="pin-digit" id="pin1" name="pin1" inputmode="numeric" pattern="[0-9]"
          autocomplete="off">
        <input type="text" maxlength="1" class="pin-digit" id="pin2" name="pin2" inputmode="numeric" pattern="[0-9]"
          autocomplete="off">
        <input type="text" maxlength="1" class="pin-digit" id="pin3" name="pin3" inputmode="numeric" pattern="[0-9]"
          autocomplete="off">
        <input type="text" maxlength="1" class="pin-digit" id="pin4" name="pin4" inputmode="numeric" pattern="[0-9]"
          autocomplete="off">
      </div>

      <div id="login-error" class="login-error" style="display:none;"></div>
      <div id="login-locked" class="login-locked" style="display:none;"></div>

      <div class="auto-login-checkbox">
        <input type="checkbox" id="rememberMe" name="rememberMe" checked>
        <label for="rememberMe">로그인 상태 유지</label>
      </div>

      <div id="last-login-info" class="last-login-info" style="display:none;"></div>

      <div class="login-buttons">
        <button class="btn btn-ghost" style="flex:1" onclick="cancelLogin()">취소</button>
        <button class="btn btn-primary" style="flex:1" onclick="submitPin()">로그인</button>
      </div>
    </div>
  </div>

  <div id="archive-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modal-title" style="margin:0; color:var(--blue);">🏆 전체 기록</h3>
      <div id="modal-body" style="font-size:0.9rem;"></div>
      <button class="btn btn-primary" style="width:100%"
        onclick="document.getElementById('archive-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div class="app-wrapper">
    <header>
      <h1>마인크래프트 포인트 잔치</h1>
      <div style="color: var(--muted); font-size: 0.9rem; margin-top: 8px; font-weight: 600;">
        <span id="logged-user-name"></span>
        <button id="logout-btn" class="btn btn-ghost" style="margin-left:10px; display:none;"
          onclick="logout()">로그아웃</button>
      </div>
    </header>

    <div class="player-selector" id="player-selector-section">
      <h3>👦 누구의 미션을 볼까요?</h3>
      <div class="player-buttons" id="player-selector"></div>
    </div>

    <section class="top-section" id="main-content" style="display:none;">
      <div class="panel">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 10px;">📅 날짜 선택</div>
        <div
          style="position: relative; background: var(--input-bg); padding: 15px; border-radius: 16px; text-align: center;">
          <span id="dateText" style="font-size: 1.2rem; font-weight: 800; color: var(--blue);"></span>
          <input type="date" id="viewDate" name="viewDate" onchange="handleDateChange(this.value)"
            style="width: 100%; margin-top: 10px;">
        </div>
        <div style="display: flex; gap: 6px; margin-top: 10px;">
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(-1)">어제</button>
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(0)">오늘</button>
          <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(1)">내일</button>
        </div>
      </div>

      <div class="panel" style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 5px;">📢 부모님 응원</div>
        <div class="parent-msg-box">
          <div class="parent-photo"><img id="photo-dad" src="" alt="아빠" loading="lazy"
              style="max-width:50px; max-height:50px;"></div>
          <div id="cheer-dad" class="bubble dad text-clamp" style="display: none;"><span></span></div>
        </div>
        <div class="parent-msg-box">
          <div class="parent-photo"><img id="photo-mom" src="" alt="엄마" loading="lazy"
              style="max-width:50px; max-height:50px;"></div>
          <div id="cheer-mom" class="bubble mom text-clamp" style="display: none;"><span></span></div>
        </div>
      </div>
    </section>

    <main id="player-content"></main>

    <div id="shared-progress-section" style="display:none;">
      <div class="panel shared-progress-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0; color:#92400e;">🏆 모두의 진행현황</h3>
          <button class="btn btn-ghost" style="font-size:0.8rem; background:rgba(255,255,255,0.7);"
            onclick="toggleSharedProgress()">
            <span id="toggle-icon">▼</span> <span id="toggle-text">접기</span>
          </button>
        </div>
        <div id="progress-grid" class="progress-grid"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, get, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ============================================
    // Firebase 환경 설정 (자동 분기)
    // ============================================
    // 버전: v4.0-FINAL

    // 환경 자동 감지
    const hostname = window.location.hostname;
    const isDev = hostname.includes("-dev.web.app") ||
      hostname.includes("-dev.firebaseapp.com") ||
      hostname === "localhost" ||
      hostname === "127.0.0.1";

    // 환경별 Firebase Config
    const firebaseConfig = isDev ? {
      // 개발계 (Development)
      apiKey: "AIzaSyBVfTiYEHTeon2zdbXEZsaDzkV0",
      authDomain: "mark-point-festivals-dev.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-dev-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mark-point-festivals-dev",
      storageBucket: "mark-point-festivals-dev.firebasestorage.app",
      messagingSenderId: "876196518434",
      appId: "1:876196518434:web:e60a09f47a910a9b79887b"
    } : {
      // 운영계 (Production)
      apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
      authDomain: "mark-point-festivals.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
      projectId: "mark-point-festivals",
      storageBucket: "mark-point-festivals.firebasestorage.app",
      messagingSenderId: "87999590531",
      appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
    };

    // 환경 표시
    const envLabel = isDev ? "개발계" : "운영계";
    const envColor = isDev ? "#4ade80" : "#ef4444";
    const envIcon = isDev ? "🟢" : "🔴";

    console.log('%c ====================================', 'color: #64748b;');
    console.log(
      `%c ${envIcon} ${envLabel} (${isDev ? 'Development' : 'Production'}) `,
      `background: ${envColor}; color: ${isDev ? '#000' : '#fff'}; font-weight: bold; padding: 4px 8px; border-radius: 4px;`
    );
    console.log(`%c 📦 Version: v4.0-FINAL`, `color: #8b5cf6; font-weight: bold;`);
    console.log(`%c 🌐 Hostname: ${hostname}`, `color: #64748b;`);
    console.log(`%c 🗄️  Database: ${firebaseConfig.databaseURL}`, `color: #64748b; font-size: 0.85em;`);
    console.log('%c ====================================', 'color: #64748b;');

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const refs = {
      players: ref(db, 'mc_players/'),
      data: ref(db, 'mc_mission_data/'),
      cheer: ref(db, 'mc_cheer_msgs/'),
      config: ref(db, 'mc_config/'),
      feedback: ref(db, 'mc_feedbacks/'),
      deductions: ref(db, 'mc_deductions/'),
      loginLogs: ref(db, 'mc_login_logs/'),
      dailyPoints: ref(db, 'mc_daily_points/'),
      notifications: ref(db, 'mc_notifications/')
    };

    let state = { players: {}, missions: {}, cheers: {}, config: {}, feedbacks: {}, deductions: {}, dailyPoints: {} };
    let loggedInPlayerId = null;
    let attemptingPlayerId = null;
    let global = { accordionState: {}, sharedProgressExpanded: true };

    const getKSTDate = (date = new Date()) => {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().split('T')[0];
    };

    document.getElementById('viewDate').value = getKSTDate();
    document.getElementById('dateText').innerText = getKSTDate();

    // 자동 로그인 체크
    async function checkAutoLogin() {
      const savedPlayerId = localStorage.getItem('loggedInPlayer');
      const rememberMe = localStorage.getItem('rememberMe') === 'true';

      if (savedPlayerId && rememberMe && state.players[savedPlayerId]) {
        const player = state.players[savedPlayerId];
        if (player.lockUntil && Date.now() < player.lockUntil) {
          localStorage.removeItem('loggedInPlayer');
          return;
        }

        loggedInPlayerId = savedPlayerId;
        await updateLastLogin(savedPlayerId);
        await checkAndFailExpiredMissions(savedPlayerId);
        showMainContent();
      }
    }

    // 자정 처리: 과거 미션 실패 처리
    async function checkAndFailExpiredMissions(pId) {
      const today = getKSTDate();
      const allDatesSnapshot = await get(ref(db, `mc_mission_data/${pId}`));
      const allDates = allDatesSnapshot.val() || {};

      Object.entries(allDates).forEach(async ([date, dateData]) => {
        if (date < today) {
          const missions = dateData.missions || {};
          Object.entries(missions).forEach(async ([mId, m]) => {
            if (m.status === 'active' || m.status === 'pending_approval') {
              await update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), {
                status: 'failed'
              });
            }
          });
        }
      });
    }

    // Firebase 구독
    onValue(refs.players, (snap) => { state.players = snap.val() || {}; renderPlayerSelector(); checkAutoLogin(); render(); renderSharedProgress(); });
    onValue(refs.data, (snap) => { state.missions = snap.val() || {}; render(); renderSharedProgress(); });
    onValue(refs.cheer, (snap) => { state.cheers = snap.val() || {}; updateCheerDisplay(); });
    onValue(refs.config, (snap) => { state.config = snap.val() || {}; updateConfigUI(); });
    onValue(refs.feedback, (snap) => { state.feedbacks = snap.val() || {}; render(); });
    onValue(refs.deductions, (snap) => { state.deductions = snap.val() || {}; render(); renderSharedProgress(); });
    onValue(refs.dailyPoints, (snap) => { state.dailyPoints = snap.val() || {}; render(); renderSharedProgress(); });

    function updateConfigUI() {
      const photos = state.config.photos || {};
      if (photos.dad) document.getElementById('photo-dad').src = photos.dad;
      if (photos.mom) document.getElementById('photo-mom').src = photos.mom;
    }

    function updateCheerDisplay() {
      const date = document.getElementById('viewDate').value;
      const dayCheer = state.cheers[date] || {};
      const dad = document.getElementById('cheer-dad');
      const mom = document.getElementById('cheer-mom');
      dad.style.display = dayCheer.dad ? 'block' : 'none';
      if (dayCheer.dad) dad.querySelector('span').innerText = dayCheer.dad;
      mom.style.display = dayCheer.mom ? 'block' : 'none';
      if (dayCheer.mom) mom.querySelector('span').innerText = dayCheer.mom;
    }

    function renderPlayerSelector() {
      const container = document.getElementById('player-selector');
      if (!state.players || Object.keys(state.players).length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">등록된 아이가 없습니다.</div>';
        return;
      }
      container.innerHTML = Object.entries(state.players).map(([pId, p]) => `
      <button class="player-btn" onclick="selectPlayer('${pId}')">
        ${p.name} ${p.lockUntil && Date.now() < p.lockUntil ? '🔒' : ''}
      </button>
    `).join('');
    }

    window.selectPlayer = async (pId) => {
      attemptingPlayerId = pId;
      const player = state.players[pId];

      if (!player.pin) {
        alert('관리자가 PIN을 먼저 설정해주세요.');
        return;
      }

      if (player.lockUntil && Date.now() < player.lockUntil) {
        const remainingMin = Math.ceil((player.lockUntil - Date.now()) / 60000);
        alert(`🔒 ${remainingMin}분 후에 다시 시도해주세요.`);
        return;
      }

      if (player.lastLogin) {
        const lastLoginDate = new Date(player.lastLogin);
        const formatted = lastLoginDate.toLocaleString('ko-KR');
        document.getElementById('last-login-info').innerText = `마지막 접속: ${formatted}`;
        document.getElementById('last-login-info').style.display = 'block';
      }

      document.getElementById('login-player-name').innerText = player.name;
      document.getElementById('login-overlay').style.display = 'flex';
      document.getElementById('pin1').focus();
      setupPinInputs();
    };

    function setupPinInputs() {
      const pins = ['pin1', 'pin2', 'pin3', 'pin4'];
      pins.forEach((id, idx) => {
        const input = document.getElementById(id);
        input.value = '';
        input.classList.remove('filled', 'error');

        input.oninput = (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          if (e.target.value && idx < pins.length - 1) {
            document.getElementById(pins[idx + 1]).focus();
          }
          if (e.target.value) {
            e.target.classList.add('filled');
          } else {
            e.target.classList.remove('filled');
          }
          if (idx === 3 && e.target.value) {
            setTimeout(() => submitPin(), 300);
          }
        };

        input.onkeydown = (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            document.getElementById(pins[idx - 1]).focus();
          }
        };
      });
    }

    window.submitPin = async () => {
      const enteredPin = ['pin1', 'pin2', 'pin3', 'pin4'].map(id => document.getElementById(id).value).join('');

      if (enteredPin.length !== 4) {
        showLoginError('4자리 PIN을 입력해주세요.');
        return;
      }

      const player = state.players[attemptingPlayerId];

      if (enteredPin === player.pin) {
        loggedInPlayerId = attemptingPlayerId;
        await saveLoginLog(attemptingPlayerId, true);
        await updateLastLogin(attemptingPlayerId);
        await update(ref(db, `mc_players/${attemptingPlayerId}`), { loginAttempts: 0, lockUntil: null });
        await checkAndFailExpiredMissions(attemptingPlayerId);

        const rememberMe = document.getElementById('rememberMe').checked;
        if (rememberMe) {
          localStorage.setItem('loggedInPlayer', attemptingPlayerId);
          localStorage.setItem('rememberMe', 'true');
        }

        document.getElementById('login-overlay').style.display = 'none';
        showMainContent();

      } else {
        await saveLoginLog(attemptingPlayerId, false);
        const attempts = (player.loginAttempts || 0) + 1;
        await update(ref(db, `mc_players/${attemptingPlayerId}`), { loginAttempts: attempts });

        if (attempts >= 5) {
          const lockUntil = Date.now() + (5 * 60 * 1000);
          await update(ref(db, `mc_players/${attemptingPlayerId}`), { lockUntil: lockUntil, loginAttempts: 0 });
          showLoginLocked('5회 실패하여 5분간 잠금되었습니다.');
          setTimeout(() => { document.getElementById('login-overlay').style.display = 'none'; }, 2000);
        } else {
          showLoginError(`잘못된 PIN입니다. (${attempts}/5)`);
          ['pin1', 'pin2', 'pin3', 'pin4'].forEach(id => {
            const input = document.getElementById(id);
            input.value = '';
            input.classList.remove('filled');
            input.classList.add('error');
          });
          setTimeout(() => {
            ['pin1', 'pin2', 'pin3', 'pin4'].forEach(id => { document.getElementById(id).classList.remove('error'); });
            document.getElementById('pin1').focus();
          }, 400);
        }
      }
    };

    async function saveLoginLog(pId, success) {
      await push(ref(db, `mc_login_logs/${pId}`), { timestamp: Date.now(), success: success, date: getKSTDate() });
    }

    async function updateLastLogin(pId) {
      await update(ref(db, `mc_players/${pId}`), { lastLogin: Date.now() });
    }

    function showLoginError(message) {
      const errorEl = document.getElementById('login-error');
      errorEl.innerText = message;
      errorEl.style.display = 'block';
      setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
    }

    function showLoginLocked(message) {
      const lockedEl = document.getElementById('login-locked');
      lockedEl.innerText = message;
      lockedEl.style.display = 'block';
    }

    window.cancelLogin = () => {
      document.getElementById('login-overlay').style.display = 'none';
      attemptingPlayerId = null;
    };

    window.logout = () => {
      if (confirm('로그아웃 하시겠습니까?')) {
        loggedInPlayerId = null;
        localStorage.removeItem('loggedInPlayer');
        localStorage.removeItem('rememberMe');
        document.getElementById('player-selector-section').style.display = 'block';
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('player-content').innerHTML = '';
        document.getElementById('shared-progress-section').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'none';
        document.getElementById('logged-user-name').innerText = '';
      }
    };

    function showMainContent() {
      if (!loggedInPlayerId) return;
      const player = state.players[loggedInPlayerId];
      document.getElementById('player-selector-section').style.display = 'none';
      document.getElementById('main-content').style.display = 'grid';
      document.getElementById('shared-progress-section').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'inline-block';
      document.getElementById('logged-user-name').innerText = `${player.name}님 환영합니다! 👋`;
      render();
      renderSharedProgress();
    }

    // 포인트 계산 함수 (v4.0) - 무한루프 방지 수정
    async function calculateDailyPoints(pId, date) {
      const missionsSnapshot = await get(ref(db, `mc_mission_data/${pId}/${date}/missions`));
      let earned = 0;

      if (missionsSnapshot.exists()) {
        missionsSnapshot.forEach((child) => {
          const m = child.val();
          if (m.status === 'completed') {
            earned += parseInt(m.point) || 0;
          }
        });
      }

      const deductionsSnapshot = await get(ref(db, `mc_deductions/${pId}/${date}`));
      let deducted = 0;

      if (deductionsSnapshot.exists()) {
        deductionsSnapshot.forEach((child) => {
          const d = child.val();
          deducted += parseInt(d.amount) || 0;
        });
      }

      const balance = earned - deducted;

      // [수정됨] 기존 값과 다를 경우에만 DB 업데이트 (무한 렌더링 방지)
      const current = state.dailyPoints[pId]?.[date];
      if (!current || current.earned !== earned || current.deducted !== deducted || current.balance !== balance) {
        await set(ref(db, `mc_daily_points/${pId}/${date}`), {
          earned,
          deducted,
          balance,
          updatedAt: Date.now()
        });
      }

      return { earned, deducted, balance };
    }

    // 승인 요청
    window.requestApproval = async (pId, date, mId) => {
      if (!confirm('미션을 완료했나요? 승인을 요청하시겠습니까?')) return;

      await update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), {
        status: 'pending_approval',
        approvalRequestedAt: Date.now()
      });

      const missionSnapshot = await get(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`));
      const mission = missionSnapshot.val();
      const player = state.players[pId];

      await push(ref(db, 'mc_notifications'), {
        type: 'approval_request',
        playerId: pId,
        playerName: player.name,
        missionId: mId,
        missionText: mission.text,
        missionPoint: mission.point,
        date: date,
        message: `${player.name}이(가) "${mission.text}" 승인을 요청했습니다`,
        read: false,
        createdAt: Date.now()
      });

      alert('✅ 승인 요청을 보냈습니다!');
    };

    // 미션 제안
    window.proposeMission = async () => {
      const pId = loggedInPlayerId;
      const date = getKSTDate();
      const text = document.getElementById('proposalText').value.trim();
      const point = parseInt(document.getElementById('proposalPoint').value);
      const reason = document.getElementById('proposalReason').value.trim();

      if (!text) {
        alert('미션 이름을 입력해주세요.');
        return;
      }

      if (!point || point <= 0) {
        alert('포인트를 입력해주세요.');
        return;
      }

      const missionsRef = ref(db, `mc_mission_data/${pId}/${date}/missions`);
      const snapshot = await get(missionsRef);
      const existingCount = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;

      const newMissionRef = push(missionsRef);
      await set(newMissionRef, {
        text,
        point,
        status: 'proposed',
        proposedBy: 'user',
        proposedAt: Date.now(),
        proposalReason: reason || '',
        sender: '본인',
        msg: '',
        order: existingCount,
        createdAt: Date.now()
      });

      const player = state.players[pId];
      await push(ref(db, 'mc_notifications'), {
        type: 'mission_proposed',
        playerId: pId,
        playerName: player.name,
        missionId: newMissionRef.key,
        missionText: text,
        missionPoint: point,
        date: date,
        message: `${player.name}이(가) "${text} (${point}P)" 미션을 제안했습니다`,
        read: false,
        createdAt: Date.now()
      });

      document.getElementById('proposalText').value = '';
      document.getElementById('proposalPoint').value = '';
      document.getElementById('proposalReason').value = '';

      alert('💡 미션 제안이 전송되었습니다!');
    };

    // 모두의 진행현황 렌더링
    function renderSharedProgress() {
      if (!loggedInPlayerId) return;

      const date = document.getElementById('viewDate').value;
      const grid = document.getElementById('progress-grid');

      if (!global.sharedProgressExpanded) {
        grid.style.display = 'none';
        return;
      }

      grid.style.display = 'grid';
      grid.innerHTML = '';

      Object.entries(state.players).forEach(([pId, p]) => {
        const mList = state.missions[pId]?.[date]?.missions || {};
        const mEntries = Object.entries(mList);

        const completed = mEntries.filter(m => m[1].status === 'completed');
        const active = mEntries.filter(m => m[1].status === 'active');
        const failed = mEntries.filter(m => m[1].status === 'failed');
        const pending = mEntries.filter(m => m[1].status === 'pending_approval');

        const dailyPoint = state.dailyPoints[pId]?.[date];
        const balance = dailyPoint?.balance || 0;

        const isCurrentUser = pId === loggedInPlayerId;

        const card = document.createElement('div');
        card.className = `progress-card ${isCurrentUser ? 'current-user' : ''}`;
        card.innerHTML = `
        <div class="progress-header">
          <div class="progress-name">${p.name} ${isCurrentUser ? '(나)' : ''}</div>
          ${isCurrentUser ? '<div class="progress-badge">내 계정</div>' : ''}
        </div>
        
        <div class="progress-stats">
          <div class="progress-stat">
            <div class="progress-stat-value">${completed.length}</div>
            <div class="progress-stat-label">완료</div>
          </div>
          <div class="progress-stat" style="background:#fffbeb;">
            <div class="progress-stat-value" style="color:#d97706;">${pending.length}</div>
            <div class="progress-stat-label">승인대기</div>
          </div>
          <div class="progress-stat" style="background:#fef3c7;">
            <div class="progress-stat-value" style="color:#d97706;">${balance}</div>
            <div class="progress-stat-label">보유P</div>
          </div>
        </div>
        
        ${mEntries.length > 0 ? `
          <div class="progress-missions">
            <div style="font-size:0.7rem; font-weight:700; color:var(--muted); margin-bottom:6px;">오늘의 미션</div>
            ${completed.slice(0, 3).map(([id, m]) => `
              <div class="progress-mission-item completed">
                <span>✅ ${m.text}</span>
                <span style="font-weight:700;">+${m.point}P</span>
              </div>
            `).join('')}
            ${pending.slice(0, 2).map(([id, m]) => `
              <div class="progress-mission-item" style="background:#fffbeb; color:#d97706;">
                <span>⏳ ${m.text}</span>
                <span style="font-weight:700;">${m.point}P</span>
              </div>
            `).join('')}
            ${active.slice(0, 2).map(([id, m]) => `
              <div class="progress-mission-item active">
                <span>🔄 ${m.text}</span>
                <span style="font-weight:700;">${m.point}P</span>
              </div>
            `).join('')}
            ${(completed.length + active.length + pending.length + failed.length) > 5 ? `
              <div style="text-align:center; font-size:0.7rem; color:var(--muted); margin-top:6px;">
                외 ${(completed.length + active.length + pending.length + failed.length) - 5}개 더
              </div>
            ` : ''}
          </div>
        ` : '<div style="text-align:center; padding:15px; color:#ccc; font-size:0.8rem;">오늘 미션 없음</div>'}
      `;

        grid.appendChild(card);
      });
    }

    window.toggleSharedProgress = () => {
      global.sharedProgressExpanded = !global.sharedProgressExpanded;
      document.getElementById('toggle-icon').innerText = global.sharedProgressExpanded ? '▼' : '▶';
      document.getElementById('toggle-text').innerText = global.sharedProgressExpanded ? '접기' : '펼치기';
      renderSharedProgress();
    };

    window.handleDateChange = (date) => { document.getElementById('dateText').innerText = date; updateCheerDisplay(); render(); renderSharedProgress(); };
    window.quickDateChange = (days) => { let d = (days === 0) ? new Date() : new Date(document.getElementById('viewDate').value); if (days !== 0) d.setDate(d.getDate() + days); const newDate = getKSTDate(d); document.getElementById('viewDate').value = newDate; handleDateChange(newDate); };
    window.updateStatusMsg = (pId, msg) => { update(ref(db, `mc_players/${pId}`), { statusMsg: msg }); };
    window.sendFeedback = (pId) => { const date = document.getElementById('viewDate').value; const msg = document.getElementById(`feedback-in-${pId}`).value; if (!msg) return; push(ref(db, `mc_feedbacks/${pId}/${date}`), { msg, createdAt: Date.now() }); document.getElementById(`feedback-in-${pId}`).value = ''; };
    window.toggleAccordion = (id) => { const el = document.getElementById(id); const isOpen = el.style.display === 'block'; el.style.display = isOpen ? 'none' : 'block'; global.accordionState[id] = !isOpen; };

    window.showArchive = async (pId) => {
      const date = document.getElementById('viewDate').value;
      const pMs = state.missions[pId]?.[date]?.missions || {};
      const allMissions = Object.entries(pMs).map(([id, m]) => ({ id, text: m.text, point: m.point, status: m.status, time: m.createdAt || 0 }));
      const completed = allMissions.filter(m => m.status === 'completed');
      const active = allMissions.filter(m => m.status === 'active');
      const failed = allMissions.filter(m => m.status === 'failed');
      const pending = allMissions.filter(m => m.status === 'pending_approval');

      const deductSnapshot = await get(ref(db, `mc_deductions/${pId}/${date}`));
      const deductList = [];
      if (deductSnapshot.exists()) {
        deductSnapshot.forEach((child) => {
          const d = child.val();
          deductList.push({ id: child.key, text: d.reason, amount: d.amount, time: d.timestamp || 0 });
        });
      }
      deductList.sort((a, b) => b.time - a.time);

      const dailyPoint = await calculateDailyPoints(pId, date);

      document.getElementById('modal-title').innerText = `${state.players[pId].name}의 ${date} 기록`;
      let html = `<div style="background:#f0f9ff; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;"><div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; font-size:0.85rem;"><div><div style="font-weight:800; color:var(--accent); font-size:1.2rem;">${dailyPoint.earned}</div><div style="color:var(--muted); font-size:0.7rem;">획득</div></div><div><div style="font-weight:800; color:var(--danger); font-size:1.2rem;">-${dailyPoint.deducted}</div><div style="color:var(--muted); font-size:0.7rem;">사용</div></div><div><div style="font-weight:800; color:var(--blue); font-size:1.2rem;">${dailyPoint.balance}</div><div style="color:var(--muted); font-size:0.7rem;">잔액</div></div></div></div>`;

      if (completed.length > 0) {
        html += '<div style="font-weight:700; color:var(--accent); margin-bottom:10px; font-size:0.9rem;">✅ 완료된 미션</div>';
        completed.forEach(m => { html += `<div class="mission-detail-item completed"><div style="display:flex; justify-content:space-between;"><span style="font-weight:600;">${m.text}</span><span style="color:var(--accent); font-weight:800;">+${m.point}P</span></div></div>`; });
      }
      if (pending.length > 0) {
        html += '<div style="font-weight:700; color:#f59e0b; margin:15px 0 10px 0; font-size:0.9rem;">⏳ 승인 대기</div>';
        pending.forEach(m => { html += `<div class="mission-detail-item" style="background:#fffbeb;"><div style="display:flex; justify-content:space-between;"><span style="font-weight:600;">${m.text}</span><span style="color:#d97706; font-weight:800;">${m.point}P 대기</span></div></div>`; });
      }
      if (active.length > 0) {
        html += '<div style="font-weight:700; color:var(--blue); margin:15px 0 10px 0; font-size:0.9rem;">🔄 진행 중</div>';
        active.forEach(m => { html += `<div class="mission-detail-item active"><div style="display:flex; justify-content:space-between;"><span style="font-weight:600;">${m.text}</span><span style="color:var(--blue); font-weight:800;">${m.point}P 대기</span></div></div>`; });
      }
      if (failed.length > 0) {
        html += '<div style="font-weight:700; color:var(--danger); margin:15px 0 10px 0; font-size:0.9rem;">❌ 실패</div>';
        failed.forEach(m => { html += `<div class="mission-detail-item failed"><div style="display:flex; justify-content:space-between;"><span style="font-weight:600; text-decoration:line-through; opacity:0.6;">${m.text}</span><span style="color:var(--danger); font-weight:800;">0P</span></div></div>`; });
      }
      if (deductList.length > 0) {
        html += '<div style="font-weight:700; color:var(--danger); margin:20px 0 10px 0; font-size:0.9rem; padding-top:15px; border-top:2px dashed #e2e8f0;">💸 사용 내역</div>';
        deductList.forEach(d => { html += `<div class="mission-detail-item" style="border-left-color:var(--danger); background:#fff5f5;"><div style="display:flex; justify-content:space-between; align-items:center;"><div><div style="font-weight:600;">${d.text}</div><small style="color:#999; font-size:0.7rem;">${date}</small></div><span style="color:var(--danger); font-weight:800;">-${d.amount}P</span></div></div>`; });
      }
      if (allMissions.length === 0 && deductList.length === 0) { html = '<div style="padding:30px; text-align:center; color:#ccc;">내역이 없습니다.</div>'; }
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('archive-modal').style.display = 'flex';
    };

    async function render() {
      if (!loggedInPlayerId) return;
      const content = document.getElementById('player-content');
      const date = document.getElementById('viewDate').value;
      const pId = loggedInPlayerId;
      const p = state.players[pId];
      if (!p) return;

      const mList = state.missions[pId]?.[date]?.missions || {};
      const mEntries = Object.entries(mList).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
      const dayFeedback = state.feedbacks[pId]?.[date] || {};

      const dailyPoint = await calculateDailyPoints(pId, date);

      const totalAllocated = mEntries.reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
      const pendingPoints = mEntries.filter(m => m[1].status === 'active' || m[1].status === 'pending_approval').reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);

      const pDeductions = {};
      const deductSnapshot = await get(ref(db, `mc_deductions/${pId}/${date}`));
      if (deductSnapshot.exists()) {
        deductSnapshot.forEach((child) => {
          pDeductions[child.key] = child.val();
        });
      }
      const totalDeducted = Object.values(pDeductions).reduce((acc, curr) => acc + (parseInt(curr.amount) || 0), 0);

      const accKey = `acc-${pId}`;
      const isAccOpen = global.accordionState[accKey] || false;

      const proposalKey = `proposal-${pId}`;
      const isProposalOpen = global.accordionState[proposalKey] || false;

      const myProposals = mEntries.filter(m => m[1].proposedBy === 'user');

      content.innerHTML = `
      <section class="panel">
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
          <div class="photo-area">${p.photo ? `<img src="${p.photo}" alt="프로필" loading="lazy" style="max-width:70px; max-height:70px; width:100%; height:100%; object-fit:cover;">` : '<div style="font-size:0.6rem; color:#64748b; padding:20px; text-align:center;">📷</div>'}</div>
          <div style="flex:1">
            <h2 style="font-family:'Black Han Sans'; font-size:1.5rem; margin:0;">${p.name}</h2>
            <input class="status-bubble-input" name="statusMsg" value="${p.statusMsg || ''}" placeholder="오늘의 다짐!" onchange="updateStatusMsg('${pId}', this.value)">
          </div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:24px;">
          <div class="stat-card" style="background:#f1f5f9;"><div style="font-size:1.1rem; font-weight:800;">${totalAllocated}</div><div style="font-size:0.6rem; font-weight:700; color:var(--muted);">오늘 배정</div></div>
          <div class="stat-card" style="background:#ecfdf5; color:var(--accent);" onclick="showArchive('${pId}')"><div style="font-size:1.1rem; font-weight:800;">${dailyPoint.balance}</div><div style="font-size:0.6rem; font-weight:700;">오늘 보유</div></div>
          <div class="stat-card" style="background:#eff6ff; color:var(--blue);"><div style="font-size:1.1rem; font-weight:800;">${pendingPoints}</div><div style="font-size:0.6rem; font-weight:700;">남은 미션</div></div>
        </div>

        <div class="accordion">
          <div class="accordion-header" onclick="toggleAccordion('${accKey}')"><span>🔻 포인트 사용 내역</span><span style="font-size:0.7rem; color:#ef4444;">(총 -${totalDeducted}P)</span></div>
          <div id="${accKey}" class="accordion-body" style="display:${isAccOpen ? 'block' : 'none'}">
            ${Object.entries(pDeductions).length ? Object.entries(pDeductions).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0)).map(([dId, d]) => `<div class="deduct-item"><div><div class="deduct-info">${d.reason}</div><div class="deduct-meta">${date}</div></div><div style="font-weight:700; color:var(--danger); font-size:0.9rem;">-${d.amount}P</div></div>`).join('') : '<div style="text-align:center; font-size:0.8rem; color:#ccc; padding:10px;">사용 내역이 없습니다.</div>'}
          </div>
        </div>

        <div class="m-list" style="margin-top:20px;">
          ${mEntries.length > 0 ? mEntries.map(([mId, m]) => {
        if (m.status === 'proposed') return ''; // 제안 상태는 별도 섹션에 표시
        const bubbleClass = m.sender === '엄마' ? 'mom' : 'dad';
        const statusTag = m.status === 'active' ? '● 진행 중' :
          m.status === 'completed' ? '✅ 완료' :
            m.status === 'pending_approval' ? '⏳ 승인 대기' :
              m.status === 'rejected' ? '❌ 거절됨' : '🚫 실패';
        const tagClass = m.status === 'active' ? 'tag-active' :
          m.status === 'completed' ? 'tag-done' :
            m.status === 'pending_approval' ? 'tag-pending' :
              m.status === 'rejected' ? 'tag-rejected' : 'tag-fail';

        return `<div class="m-item ${m.status}">
              <div class="tag ${tagClass}">${statusTag}</div>
              <div style="font-weight:700; font-size:1.05rem; margin-bottom:4px;">${m.text} (+${m.point}P)</div>
              ${m.msg ? `<div class="bubble ${bubbleClass} text-clamp" style="margin-top:8px; font-size:0.8rem;"><span><b>${m.sender}:</b> ${m.msg}</span></div>` : ''}
              ${m.status === 'active' ? `<button class="btn btn-primary" style="margin-top:10px; width:100%;" onclick="requestApproval('${pId}', '${date}', '${mId}')">✅ 완료! 승인 요청</button>` : ''}
              ${m.status === 'pending_approval' ? `<div style="margin-top:10px; text-align:center; color:#d97706; font-size:0.85rem; font-weight:600;">승인 대기 중...</div>` : ''}
              ${m.status === 'rejected' && m.rejectionReason ? `<div class="rejection-reason" style="margin-top:10px;">💬 ${m.rejectionReason}</div>` : ''}
            </div>`;
      }).join('') : '<div style="text-align:center; padding:40px; color:var(--muted);">오늘의 미션이 없습니다</div>'}
        </div>

        <div class="proposal-panel" style="margin-top:25px;">
          <h3 style="margin:0 0 5px 0; color:#92400e;">💡 미션 제안하기</h3>
          <p style="font-size:0.8rem; color:var(--muted); margin:0 0 15px 0;">하고 싶은 미션을 제안해보세요!</p>
          <div class="proposal-form">
            <input 
              type="text" 
              id="proposalText" 
              name="proposalText" 
              placeholder="미션 이름 (예: 방 청소하기)"
              autocomplete="off"
              spellcheck="false"
              style="font-size:1rem; padding:12px; border:2px solid #fbbf24; border-radius:8px;">
            <input 
              type="number" 
              id="proposalPoint" 
              name="proposalPoint" 
              placeholder="포인트 (예: 15)"
              autocomplete="off"
              inputmode="numeric"
              min="1"
              max="100"
              style="font-size:1rem; padding:12px; border:2px solid #fbbf24; border-radius:8px;">
            <textarea 
              id="proposalReason" 
              name="proposalReason" 
              placeholder="이유 (선택) - 왜 이 미션을 하고 싶은지 설명해주세요"
              autocomplete="off"
              spellcheck="false"
              rows="3"
              style="font-size:1rem; padding:12px; border:2px solid #fbbf24; border-radius:8px;"></textarea>
            <button class="btn btn-primary" style="width:100%;" onclick="proposeMission()">📤 제안하기</button>
          </div>
        </div>

        ${myProposals.length > 0 ? `
          <div class="accordion" style="margin-top:15px;">
            <div class="accordion-header" onclick="toggleAccordion('${proposalKey}')">
              <span>📋 내 제안 현황 (${myProposals.length}건)</span>
            </div>
            <div id="${proposalKey}" class="accordion-body" style="display:${isProposalOpen ? 'block' : 'none'}">
              ${myProposals.map(([mId, m]) => {
        const statusText = m.status === 'proposed' ? '⏳ 검토 중' :
          m.status === 'active' ? '✅ 승인됨 (미션으로 추가됨)' :
            m.status === 'rejected' ? '❌ 거절됨' : '상태 불명';
        const statusClass = m.status === 'proposed' ? 'pending' :
          m.status === 'active' ? 'approved' : 'rejected';

        return `
                  <div class="proposal-item ${statusClass}">
                    <div style="font-weight:700;">${m.text} (${m.point}P)</div>
                    ${m.proposalReason ? `<div style="font-size:0.85rem; margin-top:4px; font-style:italic;">이유: ${m.proposalReason}</div>` : ''}
                    <div class="proposal-status ${statusClass}">${statusText}</div>
                    ${m.status === 'rejected' && m.rejectionReason ? `
                      <div class="rejection-reason">💬 관리자: ${m.rejectionReason}</div>
                    ` : ''}
                  </div>
                `;
      }).join('')}
            </div>
          </div>
        ` : ''}

        <div style="margin-top:20px;">
          ${Object.entries(dayFeedback).map(([fbId, fb]) => `<div class="bubble player text-clamp"><span class="text-clamp"><b>${p.name}:</b> ${fb.msg}</span>${fb.replies ? `<div class="reply-box">${Object.values(fb.replies).map(r => `<div class="reply-item"><span class="reply-sender ${r.sender}">${r.sender}:</span><span class="reply-text">${r.text}</span></div>`).join('')}</div>` : ''}</div>`).join('')}
        </div>
        <div style="display:flex; gap:8px; margin-top:15px;">
          <input type="text" id="feedback-in-${pId}" name="feedback" placeholder="답장 보내기..." style="flex:1; font-size:0.85rem;">
          <button class="btn btn-primary" style="width:auto; padding:0 15px; font-size:0.85rem;" onclick="sendFeedback('${pId}')">전송</button>
        </div>
      </section>
    `;
    }
  </script>
</body>

</html>
