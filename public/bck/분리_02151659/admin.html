<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 - 마인크래프트 포인트 잔치</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<!-- 로그인 오버레이 -->
<div id="login-overlay">
  <div class="panel" style="width: 300px; text-align: center;">
    <h3>🛡️ 관리자 인증</h3>
    <input type="password" id="adminPwd" placeholder="비밀번호" style="width: 100%; box-sizing: border-box; margin-bottom: 16px;">
    <button class="btn btn-primary" style="width: 100%" onclick="tryLogin()">접속</button>
  </div>
</div>

<!-- 로그인 기록 모달 -->
<div id="login-history-modal" class="modal" onclick="this.style.display='none'">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="history-title" style="margin:0; color:var(--blue);">📊 로그인 기록</h3>
    <div id="history-body" class="login-history-list" style="margin-top:15px;"></div>
    <button class="btn btn-primary" style="width:100%; margin-top:15px;" onclick="document.getElementById('login-history-modal').style.display='none'">닫기</button>
  </div>
</div>

<!-- 전체 기록 모달 -->
<div id="archive-modal" class="modal" onclick="this.style.display='none'">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modal-title" style="margin:0; color:var(--blue);">🏆 전체 기록</h3>
    <div id="modal-body" style="font-size:0.9rem;"></div>
    <button class="btn btn-primary" style="width:100%" onclick="document.getElementById('archive-modal').style.display='none'">닫기</button>
  </div>
</div>

<!-- 작업 모달 (복제/삭제) -->
<div id="action-modal" class="modal">
  <div class="modal-content">
    <h3 id="action-title" style="margin:0;">작업 선택</h3>
    <div style="background:var(--input-bg); padding:10px; border-radius:12px;">
      <label style="font-size:0.8rem; color:var(--muted); font-weight:700;">대상 어린이:</label>
      <select id="modal-player-select" style="width:100%; margin-top:5px; background:white;"></select>
    </div>
    <div id="action-list" style="max-height:300px; overflow-y:auto;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" id="action-confirm-btn" style="flex:1">실행</button>
      <button class="btn btn-ghost" onclick="document.getElementById('action-modal').style.display='none'" style="flex:1">취소</button>
    </div>
  </div>
</div>

<!-- 포인트 차감 모달 -->
<div id="deduct-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin:0; color:var(--danger);">💸 포인트 차감</h3>
    <div style="background:#fff5f5; padding:15px; border-radius:12px; text-align:center;">
      <div id="deduct-target-name" style="font-weight:800; font-size:1.1rem; margin-bottom:5px;"></div>
      <div style="font-size:0.8rem; color:var(--muted);">현재 보유 포인트에서 차감됩니다.</div>
    </div>
    <div>
      <label style="font-size:0.8rem; font-weight:700;">사용 금액</label>
      <input type="number" id="deduct-amount" placeholder="0" style="width:100%; box-sizing:border-box;">
    </div>
    <div>
      <label style="font-size:0.8rem; font-weight:700;">사용처 (Tag)</label>
      <input type="text" id="deduct-reason" placeholder="예: 간식, 장난감" style="width:100%; box-sizing:border-box;">
    </div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-danger-sm" style="flex:1; background:var(--danger); color:white; font-size:1rem; padding:10px;" onclick="confirmDeduction()">차감하기</button>
      <button class="btn btn-ghost" style="flex:1" onclick="document.getElementById('deduct-modal').style.display='none'">취소</button>
    </div>
  </div>
</div>

<div class="app-wrapper">
  <header>
    <h1>마인크래프트 포인트 잔치</h1>
    <div style="color: var(--muted); font-size: 0.9rem; margin-top: 8px; font-weight: 600;">
      <span id="auth-btn" style="cursor:pointer; text-decoration: underline;" onclick="logout()">관리자 로그아웃</span>
    </div>
  </header>

  <!-- 사용자 관리 패널 -->
  <div class="panel user-management-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="margin:0; color:var(--accent);">👥 사용자 관리</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newKidName" placeholder="아이 이름" style="width:150px;">
        <input type="password" id="newKidPin" placeholder="PIN 4자리" maxlength="4" style="width:100px;" inputmode="numeric">
        <button class="btn btn-primary" style="padding:0 15px;" onclick="registerKid()">➕ 등록</button>
      </div>
    </div>
    
    <div class="user-list" id="user-list"></div>
  </div>

  <section class="top-section">
    <!-- 날짜 선택 -->
    <div class="panel">
      <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 10px;">📅 DATE SELECTOR</div>
      <div style="position: relative; background: var(--input-bg); padding: 15px; border-radius: 16px; text-align: center;">
        <span id="dateText" style="font-size: 1.2rem; font-weight: 800; color: var(--blue);"></span>
        <input type="date" id="viewDate" onchange="handleDateChange(this.value)" style="width: 100%; margin-top: 10px;">
      </div>
      <div style="display: flex; gap: 6px; margin-top: 10px;">
        <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(-1)">어제</button>
        <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(0)">오늘</button>
        <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(1)">내일</button>
      </div>
    </div>
    
    <!-- 부모님 응원 메시지 -->
    <div class="panel" style="display: flex; flex-direction: column; gap: 5px;">
      <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 5px;">📢 PARENTS' CHEER UP</div>
      <div class="parent-msg-box">
        <div class="parent-photo" onclick="triggerParentPhoto('dad')"><img id="photo-dad" src=""></div>
        <div id="cheer-dad" class="bubble dad text-clamp" style="display: none;"><span></span></div>
      </div>
      <div class="parent-msg-box">
        <div class="parent-photo" onclick="triggerParentPhoto('mom')"><img id="photo-mom" src=""></div>
        <div id="cheer-mom" class="bubble mom text-clamp" style="display: none;"><span></span></div>
      </div>
      
      <!-- 관리자 메시지 입력 -->
      <div style="padding-top: 10px; border-top: 1px dashed #eee; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 5px;">
          <input type="text" id="dadMsgIn" placeholder="아빠 메시지" style="flex:1">
          <button class="btn btn-primary" onclick="saveCheer('dad')">저장</button>
          <button class="btn btn-ghost" style="color:red" onclick="deleteCheer('dad')">X</button>
        </div>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="momMsgIn" placeholder="엄마 메시지" style="flex:1">
          <button class="btn btn-primary" style="background:#be185d" onclick="saveCheer('mom')">저장</button>
          <button class="btn btn-ghost" style="color:red" onclick="deleteCheer('mom')">X</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 관리자 미션 컨트롤 -->
  <div class="panel" style="display: flex; flex-direction: column; gap: 15px; border: 2px solid var(--accent);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="font-weight: 800; color: var(--accent);">🛠️ QUEST CONTROL</div>
      <div style="display:flex; gap:5px;">
        <button class="btn btn-ghost" style="background:#e8f5e9; color:#2e7d32; font-size:0.8rem;" onclick="openCopyModal()">♻️ 복제</button>
        <button class="btn btn-ghost" style="background:#fee2e2; color:#ef4444; font-size:0.8rem;" onclick="openBatchDeleteModal()">🗑️ 삭제</button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
      <select id="targetKid"></select>
      <select id="missionSender">
        <option value="아빠">아빠</option>
        <option value="엄마">엄마</option>
      </select>
      <input type="text" id="missionText" placeholder="미션 제목">
      <input type="number" id="missionPoint" placeholder="EXP" style="width: 80px">
      <input type="text" id="missionMsg" placeholder="말풍선 메시지">
      <button class="btn btn-primary" onclick="addMission()">하달</button>
    </div>
  </div>

  <!-- 플레이어 그리드 -->
  <main id="player-grid" class="player-grid"></main>
</div>

<input type="file" id="photoInput" style="display:none;" accept="image/*">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
    authDomain: "mark-point-festivals.firebaseapp.com",
    databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
    projectId: "mark-point-festivals",
    storageBucket: "mark-point-festivals.firebasestorage.app",
    messagingSenderId: "87999590531",
    appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const refs = {
    players: ref(db, 'mc_players/'),
    data: ref(db, 'mc_mission_data/'),
    cheer: ref(db, 'mc_cheer_msgs/'),
    config: ref(db, 'mc_config/'),
    feedback: ref(db, 'mc_feedbacks/'),
    deductions: ref(db, 'mc_deductions/'),
    loginLogs: ref(db, 'mc_login_logs/')
  };

  let state = {
    players: {},
    missions: {},
    cheers: {},
    config: {},
    feedbacks: {},
    deductions: {},
    loginLogs: {}
  };
  
  let isAdmin = sessionStorage.getItem('isAdmin') === 'true';
  let global = {
    targetPhotoType: null,
    editMissionId: null,
    lastCompletedCount: {},
    currentModalMode: null,
    deductTargetId: null,
    accordionState: {}
  };

  // 로그인 체크
  if (!isAdmin) {
    document.getElementById('login-overlay').style.display = 'flex';
  }

  window.tryLogin = () => {
    if(document.getElementById('adminPwd').value === 'admin1234') {
      sessionStorage.setItem('isAdmin', 'true');
      isAdmin = true;
      document.getElementById('login-overlay').style.display = 'none';
    } else {
      alert('권한이 없습니다.');
    }
  };

  window.logout = () => {
    sessionStorage.clear();
    location.href = '/';
  };

  const getKSTDate = (date = new Date()) => {
    const offset = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offset).toISOString().split('T')[0];
  };

  document.getElementById('viewDate').value = getKSTDate();
  document.getElementById('dateText').innerText = getKSTDate();

  // Firebase 구독
  onValue(refs.players, (snap) => {
    state.players = snap.val() || {};
    render();
    updateAdminSelect();
    renderUserList();
  });
  
  onValue(refs.data, (snap) => {
    state.missions = snap.val() || {};
    checkConfettiTrigger();
    render();
  });
  
  onValue(refs.cheer, (snap) => {
    state.cheers = snap.val() || {};
    updateCheerDisplay();
  });
  
  onValue(refs.config, (snap) => {
    state.config = snap.val() || {};
    updateConfigUI();
  });
  
  onValue(refs.feedback, (snap) => {
    state.feedbacks = snap.val() || {};
    render();
  });
  
  onValue(refs.deductions, (snap) => {
    state.deductions = snap.val() || {};
    render();
  });

  onValue(refs.loginLogs, (snap) => {
    state.loginLogs = snap.val() || {};
  });

  function checkConfettiTrigger() {
    const date = document.getElementById('viewDate').value;
    Object.entries(state.missions).forEach(([pId, dates]) => {
      const mList = dates[date]?.missions || {};
      const completedCount = Object.values(mList).filter(m => m.status === 'completed').length;
      if (global.lastCompletedCount[pId] !== undefined && completedCount > global.lastCompletedCount[pId]) {
        fireConfetti();
      }
      global.lastCompletedCount[pId] = completedCount;
    });
  }

  function fireConfetti() {
    if(typeof confetti === 'function') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 6000 });
  }

  // ==================== 사용자 관리 기능 ====================
  
  function renderUserList() {
    const container = document.getElementById('user-list');
    if(!state.players || Object.keys(state.players).length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">등록된 사용자가 없습니다.</div>';
      return;
    }

    container.innerHTML = Object.entries(state.players).map(([pId, p]) => {
      const isLocked = p.lockUntil && Date.now() < p.lockUntil;
      const remainingMin = isLocked ? Math.ceil((p.lockUntil - Date.now()) / 60000) : 0;
      const lastLoginDate = p.lastLogin ? new Date(p.lastLogin).toLocaleString('ko-KR', { 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit' 
      }) : '없음';
      
      return `
        <div class="user-item ${isLocked ? 'locked' : ''}">
          <div class="user-info">
            <div class="user-name">${p.name}</div>
            <div class="user-meta">
              <span class="badge">PIN: ${p.pin ? '●●●●' : '미설정'}</span>
              <span class="badge">마지막 접속: ${lastLoginDate}</span>
              ${isLocked ? `<span class="badge locked">🔒 ${remainingMin}분 잠금</span>` : ''}
              ${p.loginAttempts > 0 ? `<span class="badge" style="background:#fff3cd; color:#856404;">실패 ${p.loginAttempts}회</span>` : ''}
            </div>
          </div>
          <div class="user-actions">
            <button class="btn btn-ghost" style="font-size:0.75rem; padding:6px 10px;" onclick="setPinForUser('${pId}', '${p.name}')">🔑 PIN ${p.pin ? '변경' : '설정'}</button>
            ${isLocked ? `<button class="btn btn-ghost" style="font-size:0.75rem; padding:6px 10px; background:#fee2e2; color:#dc2626;" onclick="unlockUser('${pId}', '${p.name}')">🔓 잠금해제</button>` : ''}
            <button class="btn btn-ghost" style="font-size:0.75rem; padding:6px 10px;" onclick="showLoginHistory('${pId}', '${p.name}')">📊 기록</button>
            <button class="btn btn-ghost" style="font-size:0.75rem; padding:6px 10px; color:var(--danger);" onclick="deleteUser('${pId}', '${p.name}')">🗑️ 삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.setPinForUser = async (pId, name) => {
    const currentPin = state.players[pId].pin;
    const newPin = prompt(`${name}의 PIN ${currentPin ? '변경' : '설정'}\n\n4자리 숫자를 입력하세요:`, currentPin || '');
    
    if (newPin === null) return;
    
    if (!/^\d{4}$/.test(newPin)) {
      alert('4자리 숫자만 입력 가능합니다.');
      return;
    }
    
    await update(ref(db, `mc_players/${pId}`), { pin: newPin });
    alert(`${name}의 PIN이 ${currentPin ? '변경' : '설정'}되었습니다.`);
  };

  window.unlockUser = async (pId, name) => {
    if (confirm(`${name}의 잠금을 해제하시겠습니까?`)) {
      await update(ref(db, `mc_players/${pId}`), {
        lockUntil: null,
        loginAttempts: 0
      });
      alert(`${name}의 잠금이 해제되었습니다.`);
    }
  };

  window.deleteUser = async (pId, name) => {
    if (!confirm(`정말로 ${name}을(를) 삭제하시겠습니까?\n\n⚠️ 모든 미션 기록과 데이터가 영구 삭제됩니다!`)) return;
    
    const confirmText = prompt(`삭제하려면 "${name}"을(를) 정확히 입력하세요:`);
    if (confirmText !== name) {
      alert('이름이 일치하지 않습니다.');
      return;
    }
    
    // 모든 관련 데이터 삭제
    await remove(ref(db, `mc_players/${pId}`));
    await remove(ref(db, `mc_mission_data/${pId}`));
    await remove(ref(db, `mc_feedbacks/${pId}`));
    await remove(ref(db, `mc_deductions/${pId}`));
    await remove(ref(db, `mc_login_logs/${pId}`));
    
    alert(`${name}이(가) 완전히 삭제되었습니다.`);
  };

  window.showLoginHistory = async (pId, name) => {
    const logs = state.loginLogs[pId] || {};
    const logEntries = Object.entries(logs).sort((a, b) => b[1].timestamp - a[1].timestamp);
    
    document.getElementById('history-title').innerText = `${name}의 로그인 기록`;
    
    if (logEntries.length === 0) {
      document.getElementById('history-body').innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted);">로그인 기록이 없습니다.</div>';
    } else {
      document.getElementById('history-body').innerHTML = logEntries.slice(0, 50).map(([id, log]) => {
        const date = new Date(log.timestamp);
        const formatted = date.toLocaleString('ko-KR');
        return `
          <div class="login-history-item ${log.success ? 'success' : 'failed'}">
            <div>
              <div class="login-time">${formatted}</div>
              <small style="font-size:0.75rem; color:var(--muted);">${log.date}</small>
            </div>
            <div class="login-status ${log.success ? 'success' : 'failed'}">
              ${log.success ? '✅ 성공' : '❌ 실패'}
            </div>
          </div>
        `;
      }).join('');
    }
    
    document.getElementById('login-history-modal').style.display = 'flex';
  };

  window.registerKid = async () => {
    const name = document.getElementById('newKidName').value.trim();
    const pin = document.getElementById('newKidPin').value;
    
    if (!name) {
      alert('이름을 입력하세요.');
      return;
    }
    
    if (pin && !/^\d{4}$/.test(pin)) {
      alert('PIN은 4자리 숫자만 가능합니다.');
      return;
    }
    
    await push(ref(db, 'mc_players/'), {
      name: name,
      pin: pin || '',
      totalPoints: 0,
      photo: '',
      loginAttempts: 0,
      lockUntil: null,
      lastLogin: null
    });
    
    document.getElementById('newKidName').value = '';
    document.getElementById('newKidPin').value = '';
    alert(`${name}이(가) 등록되었습니다.`);
  };

  // ==================== 이미지 압축 ====================
  
  async function compressImage(file, maxSizeKB = 50) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          const maxDim = 400;
          if (width > height && width > maxDim) {
            height = (height * maxDim) / width;
            width = maxDim;
          } else if (height > maxDim) {
            width = (width * maxDim) / height;
            height = maxDim;
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          let quality = 0.7;
          let result = canvas.toDataURL('image/jpeg', quality);
          
          while (result.length > maxSizeKB * 1024 && quality > 0.1) {
            quality -= 0.1;
            result = canvas.toDataURL('image/jpeg', quality);
          }
          
          resolve(result);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  window.triggerParentPhoto = (type) => {
    global.targetPhotoType = type;
    document.getElementById('photoInput').click();
  };
  
  window.triggerKidPhoto = (pId) => {
    global.targetPhotoType = 'kid:' + pId;
    document.getElementById('photoInput').click();
  };
  
  document.getElementById('photoInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (file && global.targetPhotoType) {
      const compressed = await compressImage(file);
      if(global.targetPhotoType.startsWith('kid:')) {
        update(ref(db, `mc_players/${global.targetPhotoType.split(':')[1]}`), { photo: compressed });
      } else {
        update(ref(db, `mc_config/photos`), { [global.targetPhotoType]: compressed });
      }
    }
  };

  function updateConfigUI() {
    const photos = state.config.photos || {};
    if(photos.dad) document.getElementById('photo-dad').src = photos.dad;
    if(photos.mom) document.getElementById('photo-mom').src = photos.mom;
  }

  window.saveCheer = (type) => {
    const date = document.getElementById('viewDate').value;
    const msg = document.getElementById(type + 'MsgIn').value;
    if(msg) set(ref(db, `mc_cheer_msgs/${date}/${type}`), msg);
    document.getElementById(type + 'MsgIn').value = '';
  };

  window.deleteCheer = (type) => {
    const date = document.getElementById('viewDate').value;
    remove(ref(db, `mc_cheer_msgs/${date}/${type}`));
  };

  function updateCheerDisplay() {
    const date = document.getElementById('viewDate').value;
    const dayCheer = state.cheers[date] || {};
    
    const dad = document.getElementById('cheer-dad');
    const mom = document.getElementById('cheer-mom');
    
    dad.style.display = dayCheer.dad ? 'block' : 'none';
    if(dayCheer.dad) dad.querySelector('span').innerText = dayCheer.dad;
    
    mom.style.display = dayCheer.mom ? 'block' : 'none';

  window.handleDateChange = (date) => {
    document.getElementById('dateText').innerText = date;
    updateCheerDisplay();
    render();
  };

  window.quickDateChange = (days) => {
    let d = (days === 0) ? new Date() : new Date(document.getElementById('viewDate').value);
    if (days !== 0) d.setDate(d.getDate() + days);
    const newDate = getKSTDate(d);
    document.getElementById('viewDate').value = newDate;
    handleDateChange(newDate);
  };

  function updateAdminSelect() {
    const select = document.getElementById('targetKid');
    if (select) {
      const current = select.value;
      select.innerHTML = Object.entries(state.players).map(([id, p]) => `<option value="${id}">${p.name}</option>`).join('');
      if (!current && Object.keys(state.players).length > 0) {
        select.value = Object.keys(state.players)[0];
      } else if(current && state.players[current]) {
        select.value = current;
      }
    }
  }

  // 미션 관리
  window.addMission = () => {
    const pId = document.getElementById('targetKid').value;
    const date = document.getElementById('viewDate').value;
    const text = document.getElementById('missionText').value;
    const point = document.getElementById('missionPoint').value;
    
    if (!pId || !text) return alert("필수값 누락");
    
    const nextOrder = Object.keys(state.missions[pId]?.[date]?.missions || {}).length;
    push(ref(db, `mc_mission_data/${pId}/${date}/missions`), {
      text,
      point: parseInt(point)||0,
      sender: document.getElementById('missionSender').value,
      msg: document.getElementById('missionMsg').value,
      status: 'active',
      order: nextOrder,
      createdAt: Date.now()
    }).then(() => {
      document.getElementById('missionText').value = '';
      document.getElementById('missionMsg').value = '';
      document.getElementById('missionText').focus();
    });
  };

  window.setMissionStatus = (pId, date, mId, status, point = 0) => {
    const currentStatus = state.missions[pId][date].missions[mId].status;
    
    if (status === 'completed' && currentStatus !== 'completed') {
      update(ref(db, `mc_players/${pId}`), { totalPoints: (state.players[pId].totalPoints || 0) + point });
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    } else if (currentStatus === 'completed' && status !== 'completed') {
      update(ref(db, `mc_players/${pId}`), { totalPoints: Math.max(0, (state.players[pId].totalPoints || 0) - point) });
    }
    
    update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status });
  };

  window.toggleEdit = (mId) => {
    global.editMissionId = (global.editMissionId === mId) ? null : mId;
    render();
  };

  window.saveMissionEdit = (pId, date, mId) => {
    const text = document.getElementById(`edit-text-${mId}`).value;
    const point = parseInt(document.getElementById(`edit-point-${mId}`).value);
    update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { text, point });
    global.editMissionId = null;
  };

  window.deleteMission = (pId, date, mId) => {
    if(confirm('영구 삭제?')) remove(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`));
  };

  window.moveOrder = (pId, date, mId, direction) => {
    const mList = Object.entries(state.missions[pId][date].missions).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
    const idx = mList.findIndex(x => x[0] === mId);
    
    if (direction === 'up' && idx > 0) {
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx][0]}`), { order: mList[idx-1][1].order });
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx-1][0]}`), { order: mList[idx][1].order });
    } else if (direction === 'down' && idx < mList.length - 1) {
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx][0]}`), { order: mList[idx+1][1].order });
      update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mList[idx+1][0]}`), { order: mList[idx][1].order });
    }
  };

  window.updateKidName = (pId) => {
    const newName = prompt("이름 변경:", state.players[pId].name);
    if(newName) update(ref(db, `mc_players/${pId}`), { name: newName });
  };

  window.updateStatusMsg = (pId, msg) => {
    update(ref(db, `mc_players/${pId}`), { statusMsg: msg });
  };

  // 포인트 차감
  window.openDeductModal = (pId) => {
    global.deductTargetId = pId;
    document.getElementById('deduct-target-name').innerText = state.players[pId].name;
    document.getElementById('deduct-amount').value = '';
    document.getElementById('deduct-reason').value = '';
    document.getElementById('deduct-modal').style.display = 'flex';
  };

  window.confirmDeduction = () => {
    const pId = global.deductTargetId;
    const amount = parseInt(document.getElementById('deduct-amount').value);
    const reason = document.getElementById('deduct-reason').value;
    
    if(!amount || amount <= 0) return alert("금액을 입력하세요.");
    if(!reason) return alert("사용처를 입력하세요.");
    
    push(ref(db, `mc_deductions/${pId}`), { amount, reason, date: getKSTDate(), timestamp: Date.now() });
    update(ref(db, `mc_players/${pId}`), { totalPoints: (state.players[pId].totalPoints || 0) - amount });
    document.getElementById('deduct-modal').style.display = 'none';
  };

  window.deleteDeduction = (pId, dId, amount) => {
    if(confirm(`차감 내역을 삭제하고 ${amount}P를 복구하시겠습니까?`)) {
      remove(ref(db, `mc_deductions/${pId}/${dId}`));
      update(ref(db, `mc_players/${pId}`), { totalPoints: (state.players[pId].totalPoints || 0) + amount });
    }
  };

  window.editDeduction = (pId, dId, oldAmt, oldReason) => {
    const newAmtStr = prompt("수정할 금액:", oldAmt);
    if(newAmtStr === null) return;
    const newAmt = parseInt(newAmtStr);
    if(isNaN(newAmt)) return alert("숫자만 입력하세요");
    const newReason = prompt("수정할 사유:", oldReason);
    if(newReason === null) return;
    const diff = newAmt - oldAmt;
    update(ref(db, `mc_deductions/${pId}/${dId}`), { amount: newAmt, reason: newReason });
    update(ref(db, `mc_players/${pId}`), { totalPoints: (state.players[pId].totalPoints || 0) - diff });
  };

  // 잔액 동기화
  window.recalculateTotalPoints = async (pId) => {
    if(!confirm(`${state.players[pId].name}의 잔액을 전체 기록(획득-차감) 기준으로 재계산합니다.`)) return;
    try {
      const missionsSnap = await get(ref(db, `mc_mission_data/${pId}`));
      const missionData = missionsSnap.val() || {};
      let earnedTotal = 0;
      Object.values(missionData).forEach(dateObj => {
        if(dateObj.missions) {
          Object.values(dateObj.missions).forEach(m => {
            if(m.status === 'completed') earnedTotal += (parseInt(m.point) || 0);
          });
        }
      });
      
      const deductSnap = await get(ref(db, `mc_deductions/${pId}`));
      const deductData = deductSnap.val() || {};
      let deductedTotal = 0;
      Object.values(deductData).forEach(d => { deductedTotal += (parseInt(d.amount) || 0); });
      
      const correctBalance = earnedTotal - deductedTotal;
      await update(ref(db, `mc_players/${pId}`), { totalPoints: correctBalance });
      alert(`동기화 완료!\n획득: ${earnedTotal}P\n차감: -${deductedTotal}P\n현재 보유: ${correctBalance}P`);
    } catch(e) {
      alert("오류: " + e);
    }
  };

  // 피드백
  window.sendFeedback = (pId) => {
    const date = document.getElementById('viewDate').value;
    const msg = document.getElementById(`feedback-in-${pId}`).value;
    if (!msg) return;
    push(ref(db, `mc_feedbacks/${pId}/${date}`), { msg, createdAt: Date.now() });
    document.getElementById(`feedback-in-${pId}`).value = '';
  };

  window.deleteFeedback = (pId, date, fbId) => {
    if(confirm('삭제?')) remove(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}`));
  };

  window.editFeedback = (pId, date, fbId, current) => {
    const newMsg = prompt("수정:", current);
    if(newMsg) update(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}`), { msg: newMsg });
  };

  window.toggleReplyForm = (fbId) => {
    const el = document.getElementById(`reply-form-${fbId}`);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  };

  window.addReply = (pId, date, fbId) => {
    const replyText = document.getElementById(`reply-in-${fbId}`).value;
    const sender = document.querySelector(`input[name="sender-${fbId}"]:checked`).value;
    if(!replyText) return;
    push(ref(db, `mc_feedbacks/${pId}/${date}/${fbId}/replies`), { text: replyText, sender, createdAt: Date.now() });
    document.getElementById(`reply-in-${fbId}`).value = '';
    toggleReplyForm(fbId);
  };

  // 모달 관리
  window.toggleAccordion = (id) => {
    const el = document.getElementById(id);
    const isOpen = el.style.display === 'block';
    el.style.display = isOpen ? 'none' : 'block';
    global.accordionState[id] = !isOpen;
  };

  function renderChecklist(missionsObj, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if(!missionsObj || Object.keys(missionsObj).length === 0) {
      return container.innerHTML = '<div style="color:#999; text-align:center; padding:10px;">데이터가 없습니다.</div>';
    }
    Object.entries(missionsObj).forEach(([id, m]) => {
      const div = document.createElement('div');
      div.className = 'checklist-item';
      div.innerHTML = `<input type="checkbox" value="${id}" checked> <span style="font-size:0.9rem;">${m.text} (${m.point}P)</span>`;
      container.appendChild(div);
    });
  }

  document.getElementById('modal-player-select').onchange = async (e) => {
    const pId = e.target.value;
    const date = document.getElementById('viewDate').value;
    
    if (global.currentModalMode === 'COPY') {
      const d = new Date(date);
      d.setDate(d.getDate() - 1);
      const yesterday = getKSTDate(d);
      const snapshot = await get(ref(db, `mc_mission_data/${pId}/${yesterday}/missions`));
      renderChecklist(snapshot.val(), 'action-list');
    } else if (global.currentModalMode === 'DELETE') {
      const missions = state.missions[pId]?.[date]?.missions;
      renderChecklist(missions, 'action-list');
    }
  };

  function initModalPlayerSelect() {
    const select = document.getElementById('modal-player-select');
    select.innerHTML = Object.entries(state.players).map(([id, p]) => `<option value="${id}">${p.name}</option>`).join('');
    const mainTarget = document.getElementById('targetKid').value;
    if(mainTarget) select.value = mainTarget;
    return select.value;
  }

  window.openCopyModal = async () => {
    global.currentModalMode = 'COPY';
    const pId = initModalPlayerSelect();
    const today = document.getElementById('viewDate').value;
    const d = new Date(today);
    d.setDate(d.getDate() - 1);
    const yesterday = getKSTDate(d);
    const snapshot = await get(ref(db, `mc_mission_data/${pId}/${yesterday}/missions`));
    
    document.getElementById('action-title').innerText = `${yesterday} 미션 가져오기`;
    renderChecklist(snapshot.val(), 'action-list');
    
    document.getElementById('action-confirm-btn').onclick = async () => {
      const selectedPid = document.getElementById('modal-player-select').value;
      const snap = await get(ref(db, `mc_mission_data/${selectedPid}/${yesterday}/missions`));
      const freshMissions = snap.val() || {};
      document.querySelectorAll('#action-list input:checked').forEach(cb => {
        const m = freshMissions[cb.value];
        if(m) push(ref(db, `mc_mission_data/${selectedPid}/${today}/missions`), { ...m, status: 'active', createdAt: Date.now() });
      });
      document.getElementById('action-modal').style.display = 'none';
    };
    
    document.getElementById('action-modal').style.display = 'flex';
  };

  window.openBatchDeleteModal = () => {
    global.currentModalMode = 'DELETE';
    const pId = initModalPlayerSelect();
    const date = document.getElementById('viewDate').value;
    const tMissions = state.missions[pId]?.[date]?.missions;
    
    document.getElementById('action-title').innerText = "일괄 삭제할 미션 선택";
    renderChecklist(tMissions, 'action-list');
    
    document.getElementById('action-confirm-btn').onclick = () => {
      const selectedPid = document.getElementById('modal-player-select').value;
      if(confirm('선택한 미션을 삭제하시겠습니까?')) {

          remove(ref(db, `mc_mission_data/${selectedPid}/${date}/missions/${cb.value}`));
        });
      }
      document.getElementById('action-modal').style.display = 'none';
    };
    
    document.getElementById('action-modal').style.display = 'flex';
  };

  window.showArchive = (pId) => {
    const date = document.getElementById('viewDate').value;
    const pMs = state.missions[pId]?.[date]?.missions || {};
    
    const allMissions = Object.entries(pMs).map(([id, m]) => ({
      id, text: m.text, point: m.point, status: m.status, time: m.createdAt || 0
    }));
    
    const completed = allMissions.filter(m => m.status === 'completed');
    const active = allMissions.filter(m => m.status === 'active');
    const failed = allMissions.filter(m => m.status === 'failed');
    
    const pDeductions = state.deductions[pId] || {};
    const deductList = Object.entries(pDeductions).map(([id, d]) => ({
      id, text: d.reason, amount: d.amount, date: d.date, time: d.timestamp || 0
    })).sort((a, b) => b.time - a.time);
    
    const totalAllocated = allMissions.reduce((sum, m) => sum + (parseInt(m.point) || 0), 0);
    const totalEarned = completed.reduce((sum, m) => sum + (parseInt(m.point) || 0), 0);
    const totalDeducted = deductList.reduce((sum, d) => sum + (parseInt(d.amount) || 0), 0);
    
    document.getElementById('modal-title').innerText = `${state.players[pId].name}의 상세 기록`;
    
    let html = `

        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; font-size:0.85rem;">
          <div><div style="font-weight:800; color:var(--blue); font-size:1.2rem;">${totalAllocated}</div><div style="color:var(--muted); font-size:0.7rem;">배정</div></div>
          <div><div style="font-weight:800; color:var(--accent); font-size:1.2rem;">${totalEarned}</div><div style="color:var(--muted); font-size:0.7rem;">획득</div></div>
          <div><div style="font-weight:800; color:var(--danger); font-size:1.2rem;">-${totalDeducted}</div><div style="color:var(--muted); font-size:0.7rem;">차감</div></div>
        </div>
      </div>
    `;
    
    if(completed.length > 0) {
      html += '<div style="font-weight:700; color:var(--accent); margin-bottom:10px; font-size:0.9rem;">✅ 완료된 미션</div>';
      completed.forEach(m => {
        html += `<div class="mission-detail-item completed">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-weight:600;">${m.text}</span>
            <span style="color:var(--accent); font-weight:800;">+${m.point}P</span>
          </div>
        </div>`;
      });
    }
    
    if(active.length > 0) {
      html += '<div style="font-weight:700; color:var(--blue); margin:15px 0 10px 0; font-size:0.9rem;">🔄 진행 중</div>';
      active.forEach(m => {
        html += `<div class="mission-detail-item active">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-weight:600;">${m.text}</span>
            <span style="color:var(--blue); font-weight:800;">${m.point}P 대기</span>
          </div>
        </div>`;
      });
    }

      const dayFeedback = state.feedbacks[pId]?.[date] || {};

          </div>

              <div style="display:flex; gap:5px;">

                <button class="btn-icon" style="color:var(--blue); font-size:0.8rem;" onclick="recalculateTotalPoints('${pId}')">🔄 동기화</button>

          <div class="accordion-header" onclick="toggleAccordion('${accKey}')">
            <span>🔻 포인트 사용 내역</span>

          <div id="${accKey}" class="accordion-body" style="display:${isAccOpen ? 'block' : 'none'}">

        </div>

        <div class="m-list" style="margin-top:20px;">
          ${mEntries.map(([mId, m]) => {
            const isEditing = global.editMissionId === mId;
            const bubbleClass = m.sender === '엄마' ? 'mom' : 'dad';
            return `
              <div class="m-item ${m.status} ${isEditing ? 'editing' : ''}">
                <div class="tag ${m.status === 'active' ? 'tag-active' : m.status === 'completed' ? 'tag-done' : 'tag-fail'}">
                  ${m.status === 'active' ? '● 진행 중' : m.status === 'completed' ? '✅ 완료' : '🚫 실패'}
                </div>
                ${isEditing ? `
                  <input type="text" id="edit-text-${mId}" value="${m.text}" style="width:100%; margin-bottom:8px;">
                  <div style="display:flex; gap:6px;">
                    <input type="number" id="edit-point-${mId}" value="${m.point}" style="width:60px;">
                    <button class="btn btn-primary" onclick="saveMissionEdit('${pId}','${date}','${mId}')">저장</button>
                    <button class="btn btn-ghost" onclick="toggleEdit('${mId}')">취소</button>
                  </div>
                ` : `
                  <div style="font-weight:700; font-size:1.05rem; margin-bottom:4px;">${m.text} (+${m.point}P)</div>
                `}
                ${m.msg ? `<div class="bubble ${bubbleClass} text-clamp" style="margin-top:8px; font-size:0.8rem;">
                  <span><b>${m.sender}:</b> ${m.msg}</span>
                </div>` : ''}
                <div class="order-btns">
                  <button class="btn-updown" onclick="moveOrder('${pId}','${date}','${mId}','up')">▲</button>
                  <button class="btn-updown" onclick="moveOrder('${pId}','${date}','${mId}','down')">▼</button>
                </div>
                <div style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                  ${m.status === 'active' ? `
                    <button class="btn btn-primary" onclick="setMissionStatus('${pId}','${date}','${mId}','completed',${m.point})">승인</button>
                    <button class="btn" style="background:#fee2e2; color:#ef4444; border-radius:12px; font-weight:700" onclick="setMissionStatus('${pId}','${date}','${mId}','failed')">실패</button>
                  ` : `
                    <button class="btn btn-primary" style="background:var(--gold); grid-column: span 2" onclick="setMissionStatus('${pId}','${date}','${mId}','active',${m.point})">복구</button>
                  `}
                </div>
                <div style="display:flex; gap:6px; margin-top:8px;">
                  <button class="btn btn-ghost" style="flex:1" onclick="toggleEdit('${mId}')">수정</button>
                  <button class="btn btn-ghost" style="flex:1; color:var(--danger)" onclick="deleteMission('${pId}', '${date}', '${mId}')">영구 삭제</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div style="margin-top:20px;">
          ${Object.entries(dayFeedback).map(([fbId, fb]) => `
            <div class="bubble player text-clamp">
              <div style="display:flex; justify-content:space-between;">
                <span class="text-clamp"><b>${p.name}:</b> ${fb.msg}</span>
                <div>
                  <button class="btn-icon" onclick="editFeedback('${pId}', '${date}', '${fbId}', '${fb.msg}')">✏️</button>
                  <button class="btn-icon" onclick="deleteFeedback('${pId}', '${date}', '${fbId}')">🗑️</button>
                  <button class="btn-icon" onclick="toggleReplyForm('${fbId}')">↩️</button>
                </div>
              </div>
              ${fb.replies ? `<div class="reply-box">${Object.values(fb.replies).map(r => `
                <div class="reply-item text-clamp">
                  <span class="reply-sender ${r.sender}">${r.sender}:</span>
                  <span class="reply-text text-clamp">${r.text}</span>
                </div>
              `).join('')}</div>` : ''}
              <div id="reply-form-${fbId}" style="display:none; margin-top:8px;">
                <div class="sender-radios">
                  <label><input type="radio" name="sender-${fbId}" value="아빠" checked> 👨 아빠</label>
                  <label><input type="radio" name="sender-${fbId}" value="엄마"> 👩 엄마</label>
                </div>
                <div style="display:flex; gap:5px;">
                  <input type="text" id="reply-in-${fbId}" placeholder="답글..." style="flex:1; padding:5px;">
                  <button class="btn btn-primary" style="padding:0 10px; font-size:0.7rem;" onclick="addReply('${pId}','${date}','${fbId}')">등록</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <div style="display:flex; gap:8px; margin-top:15px;">
          <input type="text" id="feedback-in-${pId}" placeholder="답장 보내기..." style="flex:1; font-size:0.85rem;">
          <button class="btn btn-primary" style="width:auto; padding:0 15px; font-size:0.85rem;" onclick="sendFeedback('${pId}')">전송</button>
        </div>
      `;
      grid.appendChild(section);
    });
  }
</script>
</body>
</html>
