<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>관리자 페이지</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div id="env-badge"
    style="display:none; position:fixed; top:0; left:0; right:0; height:5px; background:#4ade80; z-index:9999;"></div>

  <div id="notif-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>🔔 알림함</h3>
      <div id="notif-list" style="margin:15px 0; max-height:400px; overflow-y:auto;"></div>
      <button class="btn btn-primary" style="width:100%"
        onclick="document.getElementById('notif-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div id="login-history-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 style="color:var(--blue);">📊 로그인 기록</h3>
      <div id="history-body" style="margin-top:15px; max-height:300px; overflow-y:auto;"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:15px;"
        onclick="document.getElementById('login-history-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div id="deduct-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>포인트 차감</h3>
      <input type="hidden" id="deduct-pid">
      <div style="margin-top:15px;">
        <label>포인트:</label><input type="number" id="deduct-amount" style="margin-bottom:10px;">
        <label>사유:</label><input type="text" id="deduct-reason">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-ghost" style="flex:1"
          onclick="document.getElementById('deduct-modal').style.display='none'">취소</button>
        <button class="btn btn-primary" style="flex:1" onclick="submitDeduct()">차감</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <header style="display:flex; justify-content:space-between; align-items:center;">
      <h1>관리자 모드</h1>
      <div style="display:flex; align-items:center; gap:15px;">
        <button class="btn btn-ghost" onclick="showLoginHistory()">📊 기록</button>
        <div class="notification-bell" onclick="openNotif()">🔔 <span id="notif-badge" class="notification-badge"
            style="display:none;">0</span></div>
      </div>
    </header>

    <div id="admin-auth" class="panel" style="max-width:400px; margin:50px auto;">
      <h3>🔐 로그인</h3>
      <input type="password" id="admin-pw" placeholder="비밀번호" style="margin:15px 0;">
      <button class="btn btn-primary" style="width:100%" onclick="login()">접속</button>
    </div>

    <main id="admin-main" style="display:none;">
      <div id="proposal-panel" class="proposal-panel" style="display:none;">
        <h3 style="color:#d97706; margin-bottom:15px;">💡 도착한 제안</h3>
        <div id="proposal-list"></div>
      </div>

      <div class="panel" style="text-align:center;">
        <h2 id="date-display" style="color:var(--blue); font-family:'Black Han Sans';"></h2><input type="date"
          id="view-date" onchange="changeDate(this.value)" style="width:auto; text-align:center;">
      </div>

      <div class="panel">
        <h3>📢 응원 메시지</h3>
        <div class="cheer-container" style="margin-top:15px;">
          <div class="cheer-box">
            <div class="cheer-photo" onclick="upPh('dad')"><img id="img-dad"></div><input type="text" id="c-dad"
              placeholder="아빠"><button class="btn btn-primary" onclick="svCh('dad')">저장</button>
          </div>
          <div class="cheer-box">
            <div class="cheer-photo" onclick="upPh('mom')"><img id="img-mom"></div><input type="text" id="c-mom"
              placeholder="엄마"><button class="btn btn-primary" onclick="svCh('mom')">저장</button>
          </div>
        </div><input type="file" id="ph-up" accept="image/*" style="display:none;" onchange="hPh(this)">
      </div>

      <div id="player-grid" class="player-grid"></div>

      <div class="panel">
        <h3>👥 사용자 관리</h3>
        <div style="display:flex; gap:10px; margin-top:10px;"><input type="text" id="n-nm" placeholder="이름"
            style="flex:2"><input type="text" id="n-pin" placeholder="PIN(4자리)" maxlength="4" style="flex:1"><button
            class="btn btn-primary" onclick="addU()">등록</button></div>
        <div id="u-list" style="margin-top:15px;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const isDev = window.location.hostname.includes("localhost") || window.location.hostname.includes("-dev");
    if (isDev) document.getElementById('env-badge').style.display = 'block';

    const config = isDev ? {
      apiKey: "AIzaSyBVfTiYEHTeon2zdbXEZsaDzkV0",
      authDomain: "mark-point-festivals-dev.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-dev-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mark-point-festivals-dev",
      storageBucket: "mark-point-festivals-dev.firebasestorage.app",
      messagingSenderId: "876196518434",
      appId: "1:876196518434:web:e60a09f47a910a9b79887b"
    } : {
      apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
      authDomain: "mark-point-festivals.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
      projectId: "mark-point-festivals",
      storageBucket: "mark-point-festivals.firebasestorage.app",
      messagingSenderId: "87999590531",
      appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let state = { players: {}, missions: {}, deductions: {}, notifications: {}, config: {}, cheers: {}, feedbacks: {} };
    let phT = '';

    const getToday = (d = new Date()) => new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('view-date').value = getToday();
    document.getElementById('date-display').innerText = getToday();

    onValue(ref(db, 'mc_players'), s => { state.players = s.val() || {}; renU(); renM(); });
    onValue(ref(db, 'mc_mission_data'), s => { state.missions = s.val() || {}; renM(); renP(); });
    onValue(ref(db, 'mc_deductions'), s => { state.deductions = s.val() || {}; renM(); });
    onValue(ref(db, 'mc_notifications'), s => { state.notifications = s.val() || {}; updB(); });
    onValue(ref(db, 'mc_config'), s => { state.config = s.val() || {}; updPh(); });
    onValue(ref(db, 'mc_cheer_msgs'), s => { state.cheers = s.val() || {}; updCh(); });
    onValue(ref(db, 'mc_feedbacks'), s => { state.feedbacks = s.val() || {}; renM(); });

    window.login = () => { if (document.getElementById('admin-pw').value === 'admin1234') { document.getElementById('admin-auth').style.display = 'none'; document.getElementById('admin-main').style.display = 'block'; } else alert('오류'); };

    // 알림
    function updB() { const c = Object.values(state.notifications).filter(n => !n.read).length; document.getElementById('notif-badge').innerText = c; document.getElementById('notif-badge').style.display = c > 0 ? 'flex' : 'none'; }
    window.openNotif = () => {
      document.getElementById('notif-list').innerHTML = Object.entries(state.notifications).sort((a, b) => b[1].createdAt - a[1].createdAt).map(([id, n]) => `<div style="padding:10px; border-bottom:1px solid #eee; background:${n.read ? '#fff' : '#f0f9ff'}"><div>${n.message}</div><div style="font-size:0.7rem; color:#999;">${new Date(n.createdAt).toLocaleString()}</div>${!n.read ? `<button class=\"btn btn-ghost\" style=\"font-size:0.7rem\" onclick=\"mkR('${id}')\">읽음</button>` : ''}</div>`).join('') || '없음';
      document.getElementById('notif-modal').style.display = 'flex';
    };
    window.mkR = (id) => update(ref(db, `mc_notifications/${id}`), { read: true });

    // 제안 검토
    function renP() {
      const d = getToday();
      const p = [];
      Object.entries(state.players).forEach(([pId, pl]) => { Object.entries(state.missions[pId]?.[d]?.missions || {}).forEach(([mId, m]) => { if (m.status === 'proposed') p.push({ pId, mId, pl, m }); }); });
      const pan = document.getElementById('proposal-panel');
      if (p.length === 0) { pan.style.display = 'none'; return; }
      pan.style.display = 'block';
      document.getElementById('proposal-list').innerHTML = p.map(({ pId, mId, pl, m }) => `<div style="background:white; padding:10px; border-radius:10px; margin-bottom:5px;"><b>${pl.name}: ${m.text} (${m.point}P)</b><br><small>${m.proposalReason || ''}</small><div style="margin-top:5px; display:flex; gap:5px;"><button class="btn btn-primary" onclick="ap('${pId}','${mId}')">승인</button><button class="btn btn-ghost" onclick="ed('${pId}','${mId}','${m.text}','${m.point}')">수정</button><button class="btn btn-danger-sm" onclick="rj('${pId}','${mId}')">거절</button></div></div>`).join('');
    }
    window.ap = (pId, mId) => update(ref(db, `mc_mission_data/${pId}/${getToday()}/missions/${mId}`), { status: 'active', approvedAt: Date.now() });
    window.ed = (pId, mId, t, p) => { const nt = prompt('제목', t), np = prompt('포인트', p); if (nt && np) update(ref(db, `mc_mission_data/${pId}/${getToday()}/missions/${mId}`), { text: nt, point: parseInt(np), status: 'active', approvedAt: Date.now() }); };
    window.rj = (pId, mId) => { const r = prompt('사유'); if (r) update(ref(db, `mc_mission_data/${pId}/${getToday()}/missions/${mId}`), { status: 'rejected', rejectionReason: r }); };

    // 응원/사진
    function updCh() { const c = state.cheers[document.getElementById('view-date').value] || {}; document.getElementById('c-dad').value = c.dad || ''; document.getElementById('c-mom').value = c.mom || ''; }
    window.svCh = (t) => { update(ref(db, `mc_cheer_msgs/${document.getElementById('view-date').value}`), { [t]: document.getElementById(`c-${t}`).value }); alert('저장'); };
    function updPh() { const p = state.config.photos || {}; const is = "width:100%; height:100%; object-fit:cover; display:block;"; const d = document.getElementById('img-dad'), m = document.getElementById('img-mom'); if (p.dad) { d.src = p.dad; d.style.cssText = is; } if (p.mom) { m.src = p.mom; m.style.cssText = is; } }
    window.upPh = (t) => { phT = t; document.getElementById('ph-up').click(); };
    window.hPh = (i) => { const f = i.files[0]; if (f) { const r = new FileReader(); r.onload = e => update(ref(db, 'mc_config/photos'), { [phT]: e.target.result }); r.readAsDataURL(f); } };

    window.changeDate = (v) => { document.getElementById('date-display').innerText = v; renM(); updCh(); };

    // 메인 렌더링
    async function renM() {
      const d = document.getElementById('view-date').value;
      document.getElementById('player-grid').innerHTML = Object.entries(state.players).map(([pId, p]) => {
        const ms = state.missions[pId]?.[d]?.missions || {};
        const ds = state.deductions[pId]?.[d] || {};
        const fbs = state.feedbacks[pId]?.[d] || {};
        let e = 0; Object.values(ms).forEach(m => { if (m.status === 'completed') e += (parseInt(m.point) || 0) });
        let de = 0; Object.values(ds).forEach(x => { de += (parseInt(x.amount) || 0) });

        const dL = Object.entries(ds).map(([dId, v]) =>
          `<div style="font-size:0.8rem; display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #eee;"><span>${v.reason} (-${v.amount})</span><div><button onclick="editD('${pId}','${dId}','${v.amount}','${v.reason}')">수정</button><button onclick="delD('${pId}','${dId}')" style="color:red;">삭제</button></div></div>`
        ).join('');

        return `
        <div class="panel">
          <div style="display:flex; justify-content:space-between;"><h2>${p.name}</h2><b style="color:var(--blue);">${e - de} P</b></div>
          <div class="m-list">${Object.entries(ms).map(([mId, m]) => {
          if (m.status === 'proposed') return '';
          let act = '';
          if (m.status === 'active') act = `<button class="btn btn-ghost" onclick="setS('${pId}','${mId}','failed')">실패</button>`;
          else if (m.status === 'pending_approval') act = `<button class="btn btn-primary" onclick="setS('${pId}','${mId}','completed')">✅ 승인</button>`;
          else if (m.status === 'completed') act = `<button class="btn btn-ghost" onclick="setS('${pId}','${mId}','active')">취소</button>`;

          let stTag = '';
          if (m.status === 'active') stTag = '<span class="tag tag-active">진행 중</span>';
          else if (m.status === 'pending_approval') stTag = '<span class="tag tag-pending">승인 대기</span>';
          else if (m.status === 'completed') stTag = '<span class="tag tag-done">완료됨</span>';
          else if (m.status === 'failed') stTag = '<span class="tag tag-fail">실패</span>';
          else if (m.status === 'rejected') stTag = '<span class="tag tag-rejected">거절됨</span>';

          return `<div class="m-item ${m.status}" style="padding:10px;"><div>${stTag} <b>${m.text} (${m.point}P)</b></div>${m.msg ? `<small>${m.msg}</small>` : ''}<div style="margin-top:5px; display:flex; justify-content:space-between;"><div>${act}</div><button class="btn-danger-sm" onclick="delM('${pId}','${mId}')">삭제</button></div></div>`;
        }).join('')}</div>
          <div class="add-mission-box"><div style="display:flex; gap:5px;"><input id="t-${pId}" placeholder="내용"><input id="p-${pId}" placeholder="P" style="width:60px;"></div><div style="display:flex; gap:5px; margin-top:5px;"><label><input type="radio" name="s-${pId}" value="아빠" checked>아빠</label><label><input type="radio" name="s-${pId}" value="엄마">엄마</label><button class="btn btn-primary" onclick="addM('${pId}')" style="flex:1">추가</button></div></div>
          
          <div style="margin-top:10px;">
             <h5>💬 대화</h5>
             <div style="max-height:100px; overflow-y:auto;">${Object.entries(fbs).map(([fi, f]) => `<div style="font-size:0.8rem; background:#f9f9f9; padding:3px;">아이: ${f.msg}${f.replies ? Object.values(f.replies).map(r => `<br>↳ ${r.sender}: ${r.text}`).join('') : ''} <button onclick="rp('${pId}','${fi}')" style="font-size:0.7rem;">답장</button></div>`).join('')}</div>
          </div>
          <div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
            <button class="btn btn-danger-sm" style="width:100%" onclick="openDeduct('${pId}')">➖ 차감하기</button>
            ${dL ? `<div style="margin-top:10px; background:#fafafa; padding:5px;">${dL}</div>` : ''}
          </div>
        </div>
      `;
      }).join('');
    }

    window.addM = (id) => { const t = document.getElementById(`t-${id}`).value, p = document.getElementById(`p-${id}`).value, s = document.querySelector(`input[name="s-${id}"]:checked`).value; if (t && p) push(ref(db, `mc_mission_data/${id}/${document.getElementById('view-date').value}/missions`), { text: t, point: parseInt(p), sender: s, status: 'active', createdAt: Date.now() }); };
    window.setS = (pId, mId, s) => { if (s === 'completed') confetti({ particleCount: 100, origin: { y: 0.6 } }); update(ref(db, `mc_mission_data/${pId}/${document.getElementById('view-date').value}/missions/${mId}`), { status: s }); };
    window.delM = (p, m) => { if (confirm('삭제?')) remove(ref(db, `mc_mission_data/${p}/${document.getElementById('view-date').value}/missions/${m}`)); };
    window.rp = (pId, fbId) => { const t = prompt('답장 내용'); if (t) push(ref(db, `mc_feedbacks/${pId}/${document.getElementById('view-date').value}/${fbId}/replies`), { text: t, sender: '아빠', createdAt: Date.now() }); };
    window.addU = () => { const n = document.getElementById('n-nm').value, p = document.getElementById('n-pin').value; if (n && p.length === 4) push(ref(db, 'mc_players'), { name: n, pin: p }); };
    window.delU = (id) => { if (confirm('삭제?')) remove(ref(db, `mc_players/${id}`)); };
    function renU() { document.getElementById('u-list').innerHTML = Object.entries(state.players).map(([id, p]) => `<div>${p.name} (${p.pin}) <button onclick="delU('${id}')">X</button></div>`).join(''); }

    // 차감 모달/수정/삭제
    window.openDeduct = (pId) => { document.getElementById('deduct-pid').value = pId; document.getElementById('deduct-amount').value = ''; document.getElementById('deduct-reason').value = ''; document.getElementById('deduct-modal').style.display = 'flex'; };
    window.submitDeduct = () => { const pId = document.getElementById('deduct-pid').value, a = document.getElementById('deduct-amount').value, r = document.getElementById('deduct-reason').value; if (a && r) { push(ref(db, `mc_deductions/${pId}/${document.getElementById('view-date').value}`), { amount: parseInt(a), reason: r, timestamp: Date.now() }); document.getElementById('deduct-modal').style.display = 'none'; } };
    window.editD = (p, d, oa, or) => { const na = prompt('수정할 포인트', oa), nr = prompt('수정할 사유', or); if (na && nr) update(ref(db, `mc_deductions/${p}/${document.getElementById('view-date').value}/${d}`), { amount: parseInt(na), reason: nr }); };
    window.delD = (p, d) => { if (confirm('삭제?')) remove(ref(db, `mc_deductions/${p}/${document.getElementById('view-date').value}/${d}`)); };

    // 로그인 기록
    window.showLoginHistory = async () => {
      const modal = document.getElementById('login-history-modal'), body = document.getElementById('history-body');
      body.innerHTML = '로딩중...'; modal.style.display = 'flex';
      const q = query(ref(db, 'mc_login_history'), limitToLast(50));
      const snap = await get(q); const logs = []; snap.forEach(c => logs.push(c.val()));
      body.innerHTML = logs.reverse().map(l => `<div style="font-size:0.8rem; border-bottom:1px solid #eee; padding:5px;"><span style="color:${l.success ? 'green' : 'red'}">${l.success ? '성공' : '실패'}</span> <b>${l.name}</b> (${new Date(l.timestamp).toLocaleString()})</div>`).join('') || '기록 없음';
    };
  </script>
</body>

</html>
