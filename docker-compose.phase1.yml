services:
  db:
    image: postgres:16.9-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${PHASE0_DB_NAME}
      POSTGRES_USER: ${PHASE0_DB_USER}
      POSTGRES_PASSWORD: ${PHASE0_DB_PASSWORD}
    ports:
      - "15434:5432"
    volumes:
      - phase1_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PHASE0_DB_USER} -d ${PHASE0_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${PHASE0_DB_USER}:${PHASE0_DB_PASSWORD}@db:5432/${PHASE0_DB_NAME}
      JWT_SECRET: ${PHASE0_JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "1440"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCK_DURATION_SECONDS: "300"
      CORS_ORIGINS: http://localhost:13001
      PYTHONPATH: /app
    ports:
      - "18001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m alembic -c /app/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # MONGLE-NAMING-CLOSEOUT-E2E-ENVIRONMENT-RECOVERY-001: set by
        # tests/e2e/scripts/start-mongle-phase1.sh from the worktree source, and
        # re-checked against the running container by
        # verify-current-source-frontend.sh. `unset` here means the image was
        # built outside the harness, which the guard treats as a failure rather
        # than trusting the image name.
        BUILD_FINGERPRINT: ${MONGLE_FRONTEND_FINGERPRINT:-unset}
    restart: "no"
    ports:
      - "13001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phase1_pg_data:

networks:
  default:
    name: mc_phase1_network
