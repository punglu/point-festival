services:
  db:
    image: postgres:16.9-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${PHASE0_DB_NAME}
      POSTGRES_USER: ${PHASE0_DB_USER}
      POSTGRES_PASSWORD: ${PHASE0_DB_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - phase0_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PHASE0_DB_USER} -d ${PHASE0_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${PHASE0_DB_USER}:${PHASE0_DB_PASSWORD}@db:5432/${PHASE0_DB_NAME}
      JWT_SECRET: ${PHASE0_JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "1440"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCK_DURATION_SECONDS: "300"
      CORS_ORIGINS: http://localhost:13000
      PYTHONPATH: /app
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "13000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phase0_pg_data:

networks:
  default:
    name: mc_phase0_network
