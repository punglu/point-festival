<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마인크래프트 포인트 잔치</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Black+Han+Sans&display=swap');
        :root { --bg: #0f0f0f; --card: #1a1a1a; --accent: #4CAF50; --blue: #00B0FF; --text: #efefef; --muted: #666; --gold: #FFD700; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 900px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Black Han Sans', sans-serif; background: linear-gradient(45deg, var(--accent), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        
        /* 랭킹 보드 스타일 */
        .ranking-board { background: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 16px; padding: 15px; margin-bottom: 30px; }
        .ranking-title { font-family: 'Black Han Sans'; font-size: 1.1rem; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .ranking-list { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; }
        .rank-item { background: #222; padding: 8px 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; min-width: 140px; border: 1px solid #333; }
        .rank-number { font-weight: 700; color: var(--gold); font-size: 1.2rem; }

        /* 관리자/대시보드 공통 스타일 (이전과 동일) */
        #admin-panel { display: none; background: rgba(255,255,255,0.05); border: 1px solid var(--accent); border-radius: 16px; padding: 20px; margin-bottom: 30px; gap: 10px; }
        input, select { background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; outline: none; flex: 1; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .kid-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #222; position: relative; }
        .profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .photo { width: 60px; height: 60px; border-radius: 15px; background: #252525; overflow: hidden; border: 2px solid #333; cursor: pointer; }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        .name-display { font-family: 'Black Han Sans'; font-size: 1.4rem; }
        .score { margin-left: auto; font-size: 1.8rem; font-weight: 700; color: #FFAA00; }
        .m-list { list-style: none; padding: 0; }
        .m-item { background: #222; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .admin-actions { display: none; gap: 10px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .btn-act { background: transparent; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 700; padding: 5px; }
        .done { color: var(--accent); } .del { color: var(--muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>마인크래프트 포인트 잔치</h1>
        <div id="mode-text" style="font-size: 0.8rem; color: #666; margin-top: 5px;">Player View</div>
    </header>

    <div class="ranking-board">
        <div class="ranking-title">👑 오늘의 명예의 전당</div>
        <div id="ranking-list" class="ranking-list">
            </div>
    </div>

    <div id="admin-panel">
        <select id="targetKid">
            <option value="first">첫째</option>
            <option value="second">둘째</option>
        </select>
        <input type="text" id="missionText" placeholder="새로운 퀘스트 하달">
        <input type="number" id="missionPoint" placeholder="EXP" style="width:70px">
        <button class="btn-main" onclick="addMission()">전송</button>
    </div>

    <div id="grid" class="dashboard"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        // [여기에 본인의 Firebase 설정값을 입력하세요]
        apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
        authDomain: "mark-point-festivals.firebaseapp.com",
        databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
        projectId: "mark-point-festivals",
        storageBucket: "mark-point-festivals.firebasestorage.app",
        messagingSenderId: "87999590531",
        appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6""
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, 'mc_party_data/');

    const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
    let state = { first: { name: '첫째', points: 0, missions: [] }, second: { name: '둘째', points: 0, missions: [] } };

    if (isAdmin) {
        document.getElementById('admin-panel').style.display = 'flex';
        document.getElementById('mode-text').innerText = '🛡️ Admin Mode';
        document.getElementById('mode-text').style.color = 'var(--accent)';
    }

    onValue(dataRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
            state = val;
            render();
            renderRanking(); // 데이터 수신 시 랭킹도 갱신
        }
    });

    function saveToDB(data) { set(dataRef, data); }

    window.addMission = () => {
        const kid = document.getElementById('targetKid').value;
        const text = document.getElementById('missionText').value;
        const point = parseInt(document.getElementById('missionPoint').value);
        if (!text || isNaN(point)) return;
        if (!state[kid].missions) state[kid].missions = [];
        state[kid].missions.push({ text, point });
        document.getElementById('missionText').value = '';
        saveToDB(state);
    };

    window.complete = (kid, i) => {
        state[kid].points += state[kid].missions[i].point;
        state[kid].missions.splice(i, 1);
        saveToDB(state);
    };

    window.remove = (kid, i) => {
        state[kid].missions.splice(i, 1);
        saveToDB(state);
    };

    window.uploadPhoto = (kid) => {
        if (!isAdmin) return;
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => { state[kid].photo = ev.target.result; saveToDB(state); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    };

    // 🏆 랭킹 렌더링 함수
    function renderRanking() {
        const rankingList = document.getElementById('ranking-list');
        rankingList.innerHTML = '';
        
        // 데이터를 배열로 변환 후 점수순 정렬
        const sorted = Object.keys(state)
            .map(key => ({ id: key, ...state[key] }))
            .sort((a, b) => b.points - a.points);

        sorted.forEach((player, index) => {
            const item = document.createElement('div');
            item.className = 'rank-item';
            const crown = index === 0 ? '👑' : '';
            item.innerHTML = `
                <span class="rank-number">${index + 1}</span>
                <span style="font-size: 0.9rem;">${crown} ${player.name}</span>
                <span style="color: var(--gold); font-size: 0.8rem; margin-left: auto;">${player.points}P</span>
            `;
            rankingList.appendChild(item);
        });
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        ['first', 'second'].forEach(kid => {
            const d = state[kid];
            const card = document.createElement('div');
            card.className = `kid-card`;
            card.innerHTML = `
                <div class="profile">
                    <div class="photo" onclick="uploadPhoto('${kid}')">
                        ${d.photo ? `<img src="${d.photo}">` : ''}
                    </div>
                    <div class="name-display">${d.name}</div>
                    <div class="score">${d.points}P</div>
                </div>
                <ul class="m-list">
                    ${(d.missions || []).map((m, i) => `
                        <li class="m-item">
                            <div style="flex:1">
                                <span style="display:block">${m.text}</span>
                                <span style="color:var(--accent); font-size:0.8rem; font-weight:600">+${m.point} EXP</span>
                            </div>
                            <div class="admin-actions" style="${isAdmin ? 'display:flex' : 'display:none'}">
                                <button class="btn-act done" onclick="complete('${kid}', ${i})">완료</button>
                                <button class="btn-act del" onclick="remove('${kid}', ${i})">삭제</button>
                            </div>
                        </li>
                    `).join('')}
                </ul>
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
