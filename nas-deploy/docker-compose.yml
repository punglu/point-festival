version: '3.8'

# =====================================================
# 마인크래프트 포인트 잔치 - NAS Docker 배포 구성
# Synology DS218+ / DSM 7.x Compatible
# =====================================================

services:

  # ── Nginx: 정적 파일 서빙 + API 리버스 프록시 ──
  nginx:
    image: nginx:alpine
    container_name: mc_points_web
    ports:
      - "8080:80"     # 외부 8080 → 컨테이너 80
                      # ▶ 공유기 포트포워딩: 외부 80 → NAS:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mc_net

  # ── Node.js API: REST + Socket.io 실시간 ──
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mc_points_api
    volumes:
      - ./data:/app/data   # SQLite DB 영구 저장
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - mc_net

networks:
  mc_net:
    driver: bridge
