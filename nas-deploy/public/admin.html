<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>관리자 페이지(Ver 5.0.0)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="notification-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" style="max-width:600px;" onclick="event.stopPropagation()">
      <h3>🔔 알림</h3>
      <div id="notification-list" class="notification-list"></div>
      <div style="display:flex; gap:8px; margin-top:15px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="markAllAsRead()">모두 읽음 처리</button>
        <button class="btn btn-primary" style="flex:1;"
          onclick="document.getElementById('notification-modal').style.display='none'">닫기</button>
      </div>
    </div>
  </div>

  <div id="archive-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modal-title" style="margin:0; color:var(--blue);">🏆 상세 기록</h3>
      <div id="modal-body" style="font-size:0.9rem;"></div>
      <button class="btn btn-primary" style="width:100%"
        onclick="document.getElementById('archive-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div id="deduct-modal" class="modal">
    <div class="modal-content">
      <h3 id="deduct-title">포인트 차감</h3>
      <div id="deduct-body"></div>
    </div>
  </div>

  <div id="bulk-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="bulk-title"></h3>
      <div id="bulk-body"></div>
    </div>
  </div>

  <div id="action-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="action-title" style="margin:0;">작업 선택</h3>
      <div style="background:var(--input-bg); padding:10px; border-radius:12px;">
        <label style="font-size:0.8rem; color:var(--muted); font-weight:700;">대상 어린이:</label>
        <select id="modal-player-select" style="width:100%; margin-top:5px; background:white;"
          onchange="renderActionList()"></select>
        <label style="font-size:0.8rem; color:var(--muted); font-weight:700; margin-top:10px; display:block;">가져올
          날짜:</label>
        <input type="date" id="modal-date-source" style="width:100%; margin-top:5px;" onchange="renderActionList()">
      </div>
      <div id="action-list" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn btn-primary" id="action-confirm-btn" onclick="executeAction()" style="flex:1">실행</button>
        <button class="btn btn-ghost" onclick="document.getElementById('action-modal').style.display='none'"
          style="flex:1">취소</button>
      </div>
    </div>
  </div>

  <div id="login-history-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="history-title">로그인 기록</h3>
      <div id="history-list" class="login-history-list"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:15px;"
        onclick="document.getElementById('login-history-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div class="app-wrapper">
    <header
      style="position:relative; padding:20px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; box-shadow:var(--shadow);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="flex:1;"></div>
        <div style="flex:2; text-align:center;">
          <h1 style="margin:0; font-size:1.5rem; letter-spacing:-0.5px;">유빈,유현 포인트 잔치</h1>
          <div
            style="color:rgba(255,255,255,0.9); font-size:0.8rem; margin-top:6px; font-weight:500; letter-spacing:0.5px;">
            👑 관리자 모드
          </div>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:flex-end; gap:12px;">
          <div class="notification-bell" id="notification-bell" onclick="openNotifications()"
            style="display:none; cursor:pointer; position:relative; padding:8px; border-radius:12px; background:rgba(255,255,255,0.2); transition:all 0.2s; backdrop-filter:blur(10px);">
            <span style="font-size:1.3rem;">🔔</span>
            <span class="notification-badge" id="notification-badge" style="display:none;">0</span>
          </div>
          <button id="admin-logout-btn" class="btn"
            style="display:none; font-size:0.75rem; padding:8px 14px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3); color:white; backdrop-filter:blur(10px); transition:all 0.2s;"
            onclick="adminLogout()" onmouseover="this.style.background='rgba(255,255,255,0.3)'"
            onmouseout="this.style.background='rgba(255,255,255,0.2)'">
            🚪 로그아웃
          </button>
        </div>
      </div>
    </header>

    <div id="admin-auth" class="panel" style="max-width:400px; margin:50px auto;">
      <h3>🔐 관리자 인증</h3>
      <input type="password" id="admin-password" name="admin-password" placeholder="비밀번호를 입력하세요"
        style="width:100%; box-sizing:border-box; margin-bottom:15px;" autocomplete="off"
        onkeypress="if(event.key==='Enter') adminLogin()">
      <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">로그인</button>
    </div>

    <div id="admin-main" style="display:none;">

      <div class="panel"
        style="display: flex; flex-direction: column; gap: 15px; border: 2px solid var(--accent); margin-bottom: 20px;">
        <div style="font-weight: 800; color: var(--accent); font-size: 1.1rem; margin-bottom: 5px;">🛠️ QUEST CONTROL
        </div>
        <div style="display: flex; gap: 8px;">
          <select id="targetKid" style="flex: 7; padding: 10px; border-radius: 12px; border: 1px solid #ddd;"></select>
          <select id="missionSender" style="flex: 3; padding: 10px; border-radius: 12px; border: 1px solid #ddd;">
            <option value="아빠">아빠</option>
            <option value="엄마">엄마</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="missionText" placeholder="미션 제목을 입력하세요"
            style="flex: 8; padding: 10px; border-radius: 12px; border: 1px solid #ddd;">
          <input type="number" id="missionPoint" placeholder="EXP"
            style="flex: 2; padding: 10px; border-radius: 12px; border: 1px solid #ddd;">
        </div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="missionMsg" placeholder="아이에게 보낼 응원 메시지 (선택)"
            style="flex: 8; padding: 10px; border-radius: 12px; border: 1px solid #ddd;">
          <button class="btn btn-primary" onclick="addMission()" style="flex: 2;">하달</button>
        </div>
      </div>

      <div class="panel user-management-panel">
        <h3 style="margin:0 0 15px 0;">👥 사용자 관리</h3>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
          <input type="text" id="new-kid-name" name="kidName" placeholder="이름" style="flex:2;">
          <input type="text" id="new-kid-pin" name="kidPin" placeholder="PIN 4자리" maxlength="4" style="flex:1;">
          <button class="btn btn-primary" onclick="registerKid()">➕ 등록</button>
        </div>
        <div class="user-list" id="user-list"></div>
      </div>

      <div class="panel">
        <h3 style="margin:0 0 15px 0; color:#475569;">🛠 미션 관리</h3>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" onclick="openActionModal()" style="flex:1; border:2px dashed #cbd5e1;">
            📂 과거 미션 가져오기
          </button>
          <button class="btn btn-ghost" style="flex:1; background:#e8f5e9; color:#2e7d32;" onclick="openCopyModal()">
            ♻️ 일괄 복제
          </button>
          <button class="btn btn-ghost" style="flex:1; background:#fee2e2; color:#ef4444;"
            onclick="openBatchDeleteModal()">
            🗑️ 일괄 삭제
          </button>
        </div>
      </div>

      <div class="proposal-panel" id="proposal-review-section" style="display:none;">
        <h3 style="margin:0 0 10px 0; color:#92400e;">💡 미션 제안 검토</h3>
        <div id="proposal-review-list"></div>
      </div>

      <section class="top-section">
        <div class="panel">
          <div style="font-size: 0.75rem; font-weight: 800; color: var(--muted); margin-bottom: 10px;">📅 날짜 선택</div>
          <div
            style="position: relative; background: var(--input-bg); padding: 15px; border-radius: 16px; text-align: center;">
            <span id="dateText" style="font-size: 1.2rem; font-weight: 800; color: var(--blue);"></span>
            <input type="date" id="viewDate" name="viewDate" onchange="handleDateChange(this.value)"
              style="width: 100%; margin-top: 10px;">
          </div>
          <div style="display: flex; gap: 6px; margin-top: 10px;">
            <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(-1)">어제</button>
            <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(0)">오늘</button>
            <button class="btn btn-ghost" style="flex: 1" onclick="quickDateChange(1)">내일</button>
          </div>
        </div>

        <div class="panel">
          <h3>📢 부모님 응원 메시지</h3>
          <div style="display:flex; gap:12px; align-items:flex-start; margin-bottom:15px;">
            <div class="parent-photo" style="cursor:pointer;" onclick="uploadParentPhoto('dad')">
              <img id="photo-dad" src="" alt="아빠 사진" loading="lazy">
            </div>
            <div class="cheer-container">
              <div style="font-size:0.8rem; font-weight:700; color:var(--blue); margin-bottom:5px;">아빠</div>
              <textarea id="cheer-dad-input" name="cheerDad" class="cheer-input" placeholder="응원 메시지를 입력하세요"></textarea>
              <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="btn btn-primary" style="flex:1;" onclick="saveCheer('dad')">💾 저장</button>
                <button class="btn btn-danger-sm" onclick="deleteCheer('dad')">🗑️ 삭제</button>
              </div>
            </div>
          </div>
          <div style="display:flex; gap:12px; align-items:flex-start;">
            <div class="parent-photo" style="cursor:pointer;" onclick="uploadParentPhoto('mom')">
              <img id="photo-mom" src="" alt="엄마 사진" loading="lazy">
            </div>
            <div class="cheer-container">
              <div style="font-size:0.8rem; font-weight:700; color:#db2777; margin-bottom:5px;">엄마</div>
              <textarea id="cheer-mom-input" name="cheerMom" class="cheer-input" placeholder="응원 메시지를 입력하세요"></textarea>
              <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="btn btn-primary" style="flex:1;" onclick="saveCheer('mom')">💾 저장</button>
                <button class="btn btn-danger-sm" onclick="deleteCheer('mom')">🗑️ 삭제</button>
              </div>
            </div>
          </div>
          <input type="file" id="photo-upload" name="photoUpload" accept="image/*" style="display:none;"
            onchange="handlePhotoUpload()">
        </div>
      </section>

      <div id="player-cards" class="player-grid"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getDatabase, ref, onValue, push, update, get, set, remove } from '/firebase-compat.js';

    // Firebase 설정
    const hostname = window.location.hostname;
    const isDev = hostname.includes("-dev.web.app") ||
      hostname.includes("-dev.firebaseapp.com") ||
      hostname === "localhost" ||
      hostname === "127.0.0.1";

    const firebaseConfig = isDev ? {
      apiKey: "AIzaSyBVfTiYEHTeon2zdbXEZsaDzkV0",
      authDomain: "mark-point-festivals-dev.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-dev-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mark-point-festivals-dev",
      storageBucket: "mark-point-festivals-dev.firebasestorage.app",
      messagingSenderId: "876196518434",
      appId: "1:876196518434:web:e60a09f47a910a9b79887b"
    } : {
      apiKey: "AIzaSyCuvaYFkKVQLFXZXtum8o7kD1XUyw_MQvE",
      authDomain: "mark-point-festivals.firebaseapp.com",
      databaseURL: "https://mark-point-festivals-default-rtdb.firebaseio.com",
      projectId: "mark-point-festivals",
      storageBucket: "mark-point-festivals.firebasestorage.app",
      messagingSenderId: "87999590531",
      appId: "1:87999590531:web:418d4fc2a7f175ea56ebb6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const refs = {
      players: ref(db, 'mc_players/'),
      data: ref(db, 'mc_mission_data/'),
      cheer: ref(db, 'mc_cheer_msgs/'),
      config: ref(db, 'mc_config/'),
      feedback: ref(db, 'mc_feedbacks/'),
      deductions: ref(db, 'mc_deductions/'),
      loginLogs: ref(db, 'mc_login_logs/'),
      dailyPoints: ref(db, 'mc_daily_points/'),
      notifications: ref(db, 'mc_notifications/')
    };

    let state = { players: {}, missions: {}, cheers: {}, config: {}, feedbacks: {}, deductions: {}, loginLogs: {}, dailyPoints: {}, notifications: {} };
    let currentPhotoTarget = '';
    let global = { accordionState: {} };

    const getKSTDate = (date = new Date()) => {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().split('T')[0];
    };

    document.getElementById('viewDate').value = getKSTDate();
    document.getElementById('dateText').innerText = getKSTDate();

    // 관리자 인증
    window.adminLogin = () => {
      const password = document.getElementById('admin-password').value;
      if (password === 'admin1234') {
        sessionStorage.setItem('isAdmin', 'true');
        document.getElementById('admin-auth').style.display = 'none';
        document.getElementById('admin-main').style.display = 'block';
        document.getElementById('admin-logout-btn').style.display = 'inline-block';
        document.getElementById('notification-bell').style.display = 'block';
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    };

    window.adminLogout = () => {
      if (confirm('로그아웃 하시겠습니까?')) {
        sessionStorage.removeItem('isAdmin');
        location.reload();
      }
    };

    if (sessionStorage.getItem('isAdmin') === 'true') {
      document.getElementById('admin-auth').style.display = 'none';
      document.getElementById('admin-main').style.display = 'block';
      document.getElementById('admin-logout-btn').style.display = 'inline-block';
      document.getElementById('notification-bell').style.display = 'block';
    }

    onValue(refs.players, (snap) => {
      state.players = snap.val() || {};
      renderUserList();
      renderTargetKidSelect();
      render();
    });
    onValue(refs.data, (snap) => { state.missions = snap.val() || {}; render(); renderProposalReview(); });
    onValue(refs.cheer, (snap) => { state.cheers = snap.val() || {}; updateCheerDisplay(); });
    onValue(refs.config, (snap) => { state.config = snap.val() || {}; updateConfigUI(); });
    onValue(refs.feedback, (snap) => { state.feedbacks = snap.val() || {}; render(); });
    onValue(refs.deductions, (snap) => { state.deductions = snap.val() || {}; render(); });
    onValue(refs.loginLogs, (snap) => { state.loginLogs = snap.val() || {}; });
    onValue(refs.dailyPoints, (snap) => { state.dailyPoints = snap.val() || {}; render(); });
    onValue(refs.notifications, (snap) => {
      state.notifications = snap.val() || {};
      updateNotificationBadge();
      renderNotificationList();
    });

    function updateConfigUI() {
      const photos = state.config.photos || {};
      if (photos.dad) document.getElementById('photo-dad').src = photos.dad;
      if (photos.mom) document.getElementById('photo-mom').src = photos.mom;
    }

    function updateCheerDisplay() {
      const date = document.getElementById('viewDate').value;
      const dayCheer = state.cheers[date] || {};
      document.getElementById('cheer-dad-input').value = dayCheer.dad || '';
      document.getElementById('cheer-mom-input').value = dayCheer.mom || '';
    }

    function renderTargetKidSelect() {
      const select = document.getElementById('targetKid');
      if (!select) return;
      select.innerHTML = Object.entries(state.players).map(([pId, p]) =>
        `<option value="${pId}">${p.name}</option>`
      ).join('');
    }

    function updateNotificationBadge() {
      const unreadCount = Object.values(state.notifications).filter(n => !n.read).length;
      const badge = document.getElementById('notification-badge');
      if (unreadCount > 0) {
        badge.innerText = unreadCount;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    window.openNotifications = () => {
      renderNotificationList();
      document.getElementById('notification-modal').style.display = 'flex';
    };

    function renderNotificationList() {
      const list = document.getElementById('notification-list');
      const notifications = Object.entries(state.notifications).sort((a, b) => b[1].createdAt - a[1].createdAt);

      if (notifications.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted);">알림이 없습니다</div>';
        return;
      }

      list.innerHTML = notifications.map(([nId, n]) => {
        const timeAgo = getTimeAgo(n.createdAt);
        const icon = n.type === 'approval_request' ? '✅' : '💡';
        const unreadClass = n.read ? '' : 'unread';

        return `
        <div class="notification-item ${unreadClass}" id="notif-${nId}">
          <div class="notif-icon">${icon}</div>
          <div class="notif-content">
            <div>${n.message}</div>
            <div class="notif-time">${timeAgo}</div>
            <div class="notif-actions">
              <button class="btn btn-primary" style="font-size:0.8rem; padding:4px 12px;" onclick="goToMission('${n.playerId}', '${n.date}', '${n.missionId}', '${nId}')">확인하기</button>
              ${!n.read ? `<button class="btn btn-ghost" style="font-size:0.8rem; padding:4px 12px;" onclick="markAsRead('${nId}')">읽음</button>` : ''}
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    window.goToMission = async (pId, date, mId, nId) => {
      await update(ref(db, `mc_notifications/${nId}`), { read: true });
      document.getElementById('viewDate').value = date;
      handleDateChange(date);
      document.getElementById('notification-modal').style.display = 'none';

      setTimeout(() => {
        const missionEl = document.getElementById(`mission-${pId}-${mId}`);
        if (missionEl) {
          missionEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          missionEl.style.background = '#fef3c7';
          setTimeout(() => { missionEl.style.background = ''; }, 2000);
        }
      }, 500);
    };

    window.markAsRead = async (nId) => {
      await update(ref(db, `mc_notifications/${nId}`), { read: true });
    };

    window.markAllAsRead = async () => {
      const updates = {};
      Object.keys(state.notifications).forEach(nId => {
        updates[`mc_notifications/${nId}/read`] = true;
      });
      await update(ref(db), updates);
      alert('모든 알림을 읽음 처리했습니다.');
    };

    function getTimeAgo(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return '방금 전';
      if (minutes < 60) return `${minutes}분 전`;
      if (hours < 24) return `${hours}시간 전`;
      return `${days}일 전`;
    }

    // ========================================================
    // [Task 1] 제안 검토 및 승인 고도화 (데이터 정합성 보장)
    // ========================================================
    function renderProposalReview() {
      const date = getKSTDate();
      const proposals = [];

      Object.entries(state.players).forEach(([pId, p]) => {
        const missions = state.missions[pId]?.[date]?.missions || {};
        Object.entries(missions).forEach(([mId, m]) => {
          if (m.status === 'proposed') {
            proposals.push({ pId, mId, p, m, originalDate: date });
          }
        });
      });

      const section = document.getElementById('proposal-review-section');
      if (proposals.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      const list = document.getElementById('proposal-review-list');

      list.innerHTML = proposals.map(({ pId, mId, p, m, originalDate }) => {
        const timeAgo = getTimeAgo(m.proposedAt);

        return `
        <div class="proposal-review-item">
          <div class="proposal-header">
            <strong>${p.name}</strong>의 제안
            <span class="proposal-date">${timeAgo}</span>
          </div>
          <div class="proposal-content">
            <div class="proposal-field">
              <label>승인 날짜:</label>
              <input type="date" id="edit-date-${pId}-${mId}" value="${originalDate}">
            </div>
            <div class="proposal-field">
              <label>미션명:</label>
              <input type="text" id="edit-text-${pId}-${mId}" name="editText" value="${m.text}">
            </div>
            <div class="proposal-field">
              <label>포인트:</label>
              <input type="number" id="edit-point-${pId}-${mId}" name="editPoint" value="${m.point}">
            </div>
            ${m.proposalReason ? `<div class="proposal-reason">💬 이유: "${m.proposalReason}"</div>` : ''}
          </div>
          <div class="proposal-actions">
            <button class="btn btn-primary" onclick="approveProposal('${pId}', '${mId}', '${originalDate}')">✅ 승인</button>
            <button class="btn btn-danger-sm" onclick="rejectProposal('${pId}', '${mId}', '${originalDate}')">❌ 거절</button>
          </div>
        </div>
      `;
      }).join('');
    }

    // [MODIFIED] 승인 로직: 날짜 변경 시 데이터 이동 포함
    window.approveProposal = async (pId, mId, originalDate) => {
      const newDate = document.getElementById(`edit-date-${pId}-${mId}`).value;
      const text = document.getElementById(`edit-text-${pId}-${mId}`).value.trim();
      const point = parseInt(document.getElementById(`edit-point-${pId}-${mId}`).value);

      if (!text || !point || !newDate) {
        alert('날짜, 미션명, 포인트를 모두 확인해주세요.');
        return;
      }

      if (newDate === originalDate) {
        // Case 1: 날짜 변경 없음 - 기존 경로 업데이트
        await update(ref(db, `mc_mission_data/${pId}/${originalDate}/missions/${mId}`), {
          text,
          point,
          status: 'active',
          approvedAt: Date.now()
        });
      } else {
        // Case 2: 날짜 변경됨 - 데이터 이동 (Migration)
        const oldRef = ref(db, `mc_mission_data/${pId}/${originalDate}/missions/${mId}`);
        const snapshot = await get(oldRef);
        if (snapshot.exists()) {
          const data = snapshot.val();

          // 새 경로에 추가
          await push(ref(db, `mc_mission_data/${pId}/${newDate}/missions`), {
            ...data,
            text,
            point,
            status: 'active',
            approvedAt: Date.now(),
            originalDate: originalDate // 추적용
          });

          // 기존 경로 삭제
          await remove(oldRef);
        }
      }

      const player = state.players[pId];
      await push(ref(db, 'mc_notifications'), {
        type: 'proposal_approved',
        playerId: pId,
        playerName: player.name,
        missionId: mId,
        missionText: text,
        missionPoint: point,
        date: newDate, // 변경된 날짜로 알림

      await update(ref(db, `mc_mission_data/${pId}/${originalDate}/missions/${mId}`), {

    async function calculateDailyPoints(pId, date) {
      const missionsSnapshot = await get(ref(db, `mc_mission_data/${pId}/${date}/missions`));
      let earned = 0;

      if (missionsSnapshot.exists()) {
        missionsSnapshot.forEach((child) => {
          const m = child.val();
          if (m.status === 'completed') {
            earned += parseInt(m.point) || 0;
          }
        });
      }

      const deductionsSnapshot = await get(ref(db, `mc_deductions/${pId}/${date}`));
      let deducted = 0;

      if (deductionsSnapshot.exists()) {
        deductionsSnapshot.forEach((child) => {
          const d = child.val();
          deducted += parseInt(d.amount) || 0;
        });
      }

      const balance = earned - deducted;

      const current = state.dailyPoints[pId]?.[date];
      if (!current || current.earned !== earned || current.deducted !== deducted || current.balance !== balance) {
        await set(ref(db, `mc_daily_points/${pId}/${date}`), {
          earned,
          deducted,
          balance,
          updatedAt: Date.now()
        });
      }

      return { earned, deducted, balance };
    }

    window.executeCopy = async () => { const sourceDate = document.getElementById('copy-source-date').value; const targetDate = document.getElementById('copy-target-date').value; const pId = document.getElementById('copy-target-kid').value; if (!sourceDate || !targetDate) { alert('날짜를 모두 선택해주세요.'); return; } const sourceMissions = state.missions[pId]?.[sourceDate]?.missions || {}; const sourceList = Object.values(sourceMissions); if (sourceList.length === 0) { alert('원본 날짜에 미션이 없습니다.'); return; } if (!confirm(`${sourceList.length}개의 미션을 복제하시겠습니까?`)) return; const targetRef = ref(db, `mc_mission_data/${pId}/${targetDate}/missions`); const targetSnapshot = await get(targetRef); let currentOrder = targetSnapshot.exists() ? Object.keys(targetSnapshot.val()).length : 0; for (const m of sourceList) { await push(targetRef, { text: m.text, point: m.point, sender: m.sender || '아빠', msg: m.msg || '', status: 'active', order: currentOrder++, createdAt: Date.now(), proposedBy: 'admin_copy' }); } document.getElementById('bulk-modal').style.display = 'none'; alert('✅ 복제 완료!'); };
    window.openBatchDeleteModal = () => { document.getElementById('bulk-title').innerText = '🗑️ 일괄 삭제'; document.getElementById('bulk-body').innerHTML = `<div style="background:#fee2e2; padding:15px; border-radius:12px; color:#b91c1c;"><p style="margin:0 0 10px 0; font-weight:700;">⚠️ 주의: 복구할 수 없습니다!</p><label style="font-size:0.8rem; font-weight:700;">삭제할 날짜:</label><input type="date" id="delete-date" value="${document.getElementById('viewDate').value}" style="margin-bottom:10px;"><label style="font-size:0.8rem; font-weight:700;">대상 어린이:</label><select id="delete-target-kid" style="background:white;"></select></div><button class="btn btn-danger-sm" style="width:100%; margin-top:15px; padding:12px;" onclick="executeBatchDelete()">🗑️ 전체 삭제</button><button class="btn btn-ghost" style="width:100%; margin-top:5px;" onclick="document.getElementById('bulk-modal').style.display='none'">취소</button>`; const select = document.getElementById('delete-target-kid'); select.innerHTML = Object.entries(state.players).map(([pId, p]) => `<option value="${pId}">${p.name}</option>`).join(''); document.getElementById('bulk-modal').style.display = 'flex'; };
    window.executeBatchDelete = async () => { const date = document.getElementById('delete-date').value; const pId = document.getElementById('delete-target-kid').value; if (!confirm(`정말로 ${state.players[pId].name}의 ${date} 미션을 모두 삭제하시겠습니까?`)) return; await remove(ref(db, `mc_mission_data/${pId}/${date}/missions`)); await calculateDailyPoints(pId, date); document.getElementById('bulk-modal').style.display = 'none'; alert('🗑️ 삭제되었습니다.'); };
    window.openActionModal = () => { const playerSelect = document.getElementById('modal-player-select'); playerSelect.innerHTML = Object.entries(state.players).map(([pId, p]) => `<option value="${pId}">${p.name}</option>`).join(''); const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); document.getElementById('modal-date-source').value = getKSTDate(yesterday); renderActionList(); document.getElementById('action-modal').style.display = 'flex'; };
    window.renderActionList = () => { const pId = document.getElementById('modal-player-select').value; const date = document.getElementById('modal-date-source').value; const container = document.getElementById('action-list'); const missions = state.missions[pId]?.[date]?.missions || {}; const list = Object.entries(missions); if (list.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">해당 날짜에 미션이 없습니다.</div>'; return; } container.innerHTML = list.map(([mId, m]) => `<div class="checklist-item"><input type="checkbox" id="chk-${mId}" value="${mId}" checked><label for="chk-${mId}" style="flex:1; cursor:pointer;"><div style="font-weight:700;">${m.text}</div><div style="font-size:0.75rem; color:var(--muted);">${m.point}P | ${m.status}</div></label></div>`).join(''); };
    window.executeAction = async () => { const pId = document.getElementById('modal-player-select').value; const sourceDate = document.getElementById('modal-date-source').value; const targetDate = document.getElementById('viewDate').value; const checkedBoxes = document.querySelectorAll('#action-list input[type="checkbox"]:checked'); if (checkedBoxes.length === 0) { alert('선택된 미션이 없습니다.'); return; } if (!confirm(`${checkedBoxes.length}개의 미션을 ${targetDate}로 가져오시겠습니까?`)) return; const sourceMissions = state.missions[pId]?.[sourceDate]?.missions || {}; const targetRef = ref(db, `mc_mission_data/${pId}/${targetDate}/missions`); const targetSnapshot = await get(targetRef); let currentOrder = targetSnapshot.exists() ? Object.keys(targetSnapshot.val()).length : 0; for (const box of checkedBoxes) { const mId = box.value; const original = sourceMissions[mId]; if (original) { await push(targetRef, { text: original.text, point: original.point, sender: original.sender || '관리자', msg: original.msg || '', status: 'active', order: currentOrder++, createdAt: Date.now(), proposedBy: 'admin_copy' }); } } document.getElementById('action-modal').style.display = 'none'; alert('✅ 미션 가져오기 완료!'); };
    window.approveMission = async (pId, date, mId) => { await update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status: 'completed' }); await calculateDailyPoints(pId, date); };
    window.failMission = async (pId, date, mId) => { if (!confirm('미션을 실패 처리하시겠습니까?')) return; await update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status: 'failed' }); };
    window.restoreMission = async (pId, date, mId) => { await update(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`), { status: 'active' }); };
    window.deleteMission = async (pId, date, mId) => { if (!confirm('미션을 삭제하시겠습니까?')) return; await remove(ref(db, `mc_mission_data/${pId}/${date}/missions/${mId}`)); };
    window.openDeductModal = async (pId, name) => { const date = document.getElementById('viewDate').value; const dailyPoint = await calculateDailyPoints(pId, date); document.getElementById('deduct-title').innerText = `${name} - 포인트 차감 (보유: ${dailyPoint.balance}P)`; document.getElementById('deduct-body').innerHTML = `<div style="margin-bottom:15px;"><label style="font-size:0.8rem; font-weight:700; color:var(--muted);">차감 금액</label><input type="number" id="deduct-amount" name="deductAmount" placeholder="포인트" style="width:100%; box-sizing:border-box;"></div><div style="margin-bottom:15px;"><label style="font-size:0.8rem; font-weight:700; color:var(--muted);">사용처</label><input type="text" id="deduct-reason" name="deductReason" placeholder="예: 간식" style="width:100%; box-sizing:border-box;"></div><div style="display:flex; gap:8px;"><button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('deduct-modal').style.display='none'">취소</button><button class="btn btn-primary" style="flex:1;" onclick="submitDeduction('${pId}', '${date}')">차감하기</button></div>`; document.getElementById('deduct-modal').style.display = 'flex'; };
    window.submitDeduction = async (pId, date) => { const amount = parseInt(document.getElementById('deduct-amount').value); const reason = document.getElementById('deduct-reason').value.trim(); if (!amount || amount <= 0) { alert('차감 금액을 입력해주세요.'); return; } if (!reason) { alert('사용처를 입력해주세요.'); return; } await push(ref(db, `mc_deductions/${pId}/${date}`), { amount, reason, timestamp: Date.now() }); await calculateDailyPoints(pId, date); document.getElementById('deduct-modal').style.display = 'none'; alert('✅ 포인트가 차감되었습니다.'); };
    window.saveCheer = async (parent) => { const date = document.getElementById('viewDate').value; const msg = document.getElementById(`cheer-${parent}-input`).value.trim(); if (!msg) { alert('메시지를 입력해주세요.'); return; } await update(ref(db, `mc_cheer_msgs/${date}`), { [parent]: msg }); alert('✅ 저장되었습니다.'); };
    window.deleteCheer = async (parent) => { if (!confirm('메시지를 삭제하시겠습니까?')) return; const date = document.getElementById('viewDate').value; await update(ref(db, `mc_cheer_msgs/${date}`), { [parent]: null }); };
    window.uploadParentPhoto = (parent) => { currentPhotoTarget = parent; document.getElementById('photo-upload').click(); };
    window.uploadPlayerPhoto = (pId) => { currentPhotoTarget = pId; document.getElementById('photo-upload').click(); };
    window.handlePhotoUpload = async () => { const file = document.getElementById('photo-upload').files[0]; if (!file) return; let maxDim, maxSize; if (currentPhotoTarget === 'dad' || currentPhotoTarget === 'mom') { maxDim = 100; maxSize = 30; } else { maxDim = 200; maxSize = 50; } const compressed = await compressImage(file, maxSize, maxDim); if (currentPhotoTarget === 'dad' || currentPhotoTarget === 'mom') { await update(ref(db, 'mc_config/photos'), { [currentPhotoTarget]: compressed }); } else { await update(ref(db, `mc_players/${currentPhotoTarget}`), { photo: compressed }); } document.getElementById('photo-upload').value = ''; };
    async function compressImage(file, maxSizeKB = 50, maxDim = 200) { return new Promise((resolve) => { const reader = new FileReader(); reader.onload = (e) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); let width = img.width; let height = img.height; if (width > height && width > maxDim) { height = (height * maxDim) / width; width = maxDim; } else if (height > maxDim) { width = (width * maxDim) / height; height = maxDim; } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, width, height); let quality = 0.85; let result = canvas.toDataURL('image/jpeg', quality); while (result.length > maxSizeKB * 1024 && quality > 0.5) { quality -= 0.05; result = canvas.toDataURL('image/jpeg', quality); } resolve(result); }; img.src = e.target.result; }; reader.readAsDataURL(file); }); }
    window.handleDateChange = (date) => { document.getElementById('dateText').innerText = date; updateCheerDisplay(); render(); renderProposalReview(); };
    window.quickDateChange = (days) => { let d = (days === 0) ? new Date() : new Date(document.getElementById('viewDate').value); if (days !== 0) d.setDate(d.getDate() + days); const newDate = getKSTDate(d); document.getElementById('viewDate').value = newDate; handleDateChange(newDate); };
    window.changeName = async (pId) => { const newName = prompt('새 이름을 입력하세요:'); if (!newName) return; await update(ref(db, `mc_players/${pId}`), { name: newName }); };

    async function render() {
      const date = document.getElementById('viewDate').value;
      const container = document.getElementById('player-cards');

      const players = Object.entries(state.players);
      if (players.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--muted); grid-column:1/-1;">등록된 아이가 없습니다</div>';
        return;
      }

      const cards = await Promise.all(players.map(async ([pId, p]) => {
        const mList = state.missions[pId]?.[date]?.missions || {};
        const mEntries = Object.entries(mList).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
        const feedbacks = state.feedbacks[pId]?.[date] || {};

        const dailyPoint = await calculateDailyPoints(pId, date);

        // [Task 2] 통계 수정: 거절된 미션 제외
        const totalAllocated = mEntries
          .filter(m => m[1].status !== 'rejected')
          .reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);
        const pendingPoints = mEntries
          .filter(m => m[1].status === 'active' || m[1].status === 'pending_approval')
          .reduce((acc, curr) => acc + (Number(curr[1].point) || 0), 0);

        // [Task 3] 차감 내역 데이터 준비
        const deductSnapshot = await get(ref(db, `mc_deductions/${pId}/${date}`));
        const pDeductions = {};
        if (deductSnapshot.exists()) {
          deductSnapshot.forEach((child) => {
            pDeductions[child.key] = child.val();
          });
        }
        const totalDeducted = Object.values(pDeductions).reduce((acc, curr) => acc + (parseInt(curr.amount) || 0), 0);
        const accKey = `acc-${pId}`;
        const isAccOpen = global.accordionState[accKey] || false;

        return `
        <div class="panel">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
            <div class="photo-area" style="cursor:pointer;" onclick="uploadPlayerPhoto('${pId}')">
              ${p.photo ? `<img src="${p.photo}" alt="프로필" loading="lazy" style="max-width:70px; max-height:70px; width:100%; height:100%; object-fit:cover;">` : '<div style="font-size:0.6rem; color:#64748b; padding:20px; text-align:center;">📷</div>'}
            </div>
            <div style="flex:1;">
              <h3 style="margin:0; cursor:pointer;" onclick="changeName('${pId}')">${p.name}</h3>
              <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">${p.statusMsg || '상태 메시지 없음'}</div>
            </div>
          </div>
          
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:15px;">
            <div class="stat-card" style="background:#ecfdf5; color:var(--accent);" onclick="showStatDetails('${pId}', 'allocated')"><div style="font-size:1.1rem; font-weight:800;">${totalAllocated}</div><div style="font-size:0.6rem; font-weight:700;">획득(예정)</div></div>
            <div class="stat-card" style="background:#fef2f2; color:var(--danger);" onclick="showStatDetails('${pId}', 'balance')"><div style="font-size:1.1rem; font-weight:800;">-${totalDeducted}</div><div style="font-size:0.6rem; font-weight:700;">사용</div></div>
            <div class="stat-card" style="background:#eff6ff; color:var(--blue);" onclick="showStatDetails('${pId}', 'remaining')"><div style="font-size:1.1rem; font-weight:800;">${pendingPoints}</div><div style="font-size:0.6rem; font-weight:700;">잔액(예정)</div></div>
          </div>
          
          <div style="display:flex; gap:6px; margin-bottom:15px;">
            <button class="btn btn-danger-sm" style="flex:1;" onclick="openDeductModal('${pId}', '${p.name}')">➖ 차감</button>
          </div>

          <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion('${accKey}')">
              <span>🔻 포인트 사용 내역</span>
              <span style="font-size:0.7rem; color:#ef4444;">(총 -${totalDeducted}P)</span>
            </div>
            <div id="${accKey}" class="accordion-body" style="display:${isAccOpen ? 'block' : 'none'}">
              ${Object.entries(pDeductions).length ? Object.entries(pDeductions).sort((a, b) => b[1].timestamp - a[1].timestamp).map(([dId, d]) => `
                <div class="deduct-item">
                  <div>
                    <div class="deduct-info">${d.reason}</div>
                    <div class="deduct-meta">${date}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-weight:700; color:var(--danger); font-size:0.9rem;">-${d.amount}P</div>
                    <div style="margin-top:2px;">
                      <button class="btn-icon" onclick="editDeduction('${pId}','${dId}',${d.amount},'${d.reason}')">✏️</button>
                      <button class="btn-icon" style="color:var(--danger)" onclick="deleteDeduction('${pId}','${dId}',${d.amount})">✖</button>
                    </div>
                  </div>
                </div>
              `).join('') : '<div style="text-align:center; font-size:0.8rem; color:#ccc; padding:10px;">사용 내역이 없습니다.</div>'}
            </div>
          </div>
          
          <h4>📋 오늘의 미션</h4>
          <div class="m-list" style="margin-bottom:15px;">
            ${mEntries.length > 0 ? mEntries.map(([mId, m]) => {
          if (m.status === 'proposed') return '';

          const statusTag = m.status === 'active' ? '● 진행 중' :
            m.status === 'completed' ? '✅ 완료' :
              m.status === 'pending_approval' ? '⏳ 승인 대기' :
                m.status === 'rejected' ? '❌ 거절됨' : '🚫 실패';
          const tagClass = m.status === 'active' ? 'tag-active' :
            m.status === 'completed' ? 'tag-done' :
              m.status === 'pending_approval' ? 'tag-pending' :
                m.status === 'rejected' ? 'tag-rejected' : 'tag-fail';

          return `
                <div class="m-item ${m.status}" id="mission-${pId}-${mId}">
                  <div class="tag ${tagClass}">${statusTag}</div>
                  <div style="font-weight:700;">${m.text} (+${m.point}P)</div>
                  ${m.msg ? `<div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">💬 ${m.sender}: ${m.msg}</div>` : ''}
                  <div style="display:flex; gap:6px; margin-top:10px;">
                    ${m.status === 'active' || m.status === 'pending_approval' ? `<button class="btn btn-primary" style="flex:1;" onclick="approveMission('${pId}', '${date}', '${mId}')">✅ 승인</button>` : ''}
                    ${m.status === 'active' || m.status === 'pending_approval' ? `<button class="btn btn-ghost" style="flex:1;" onclick="failMission('${pId}', '${date}', '${mId}')">🚫 실패</button>` : ''}
                    ${m.status === 'completed' || m.status === 'failed' ? `<button class="btn btn-ghost" style="flex:1;" onclick="restoreMission('${pId}', '${date}', '${mId}')">↩️ 복구</button>` : ''}
                    <button class="btn btn-danger-sm" onclick="deleteMission('${pId}', '${date}', '${mId}')">🗑️</button>
                  </div>
                </div>
              `;
        }).join('') : '<div style="text-align:center; padding:20px; color:var(--muted);">미션 없음</div>'}
          </div>
          
          <h4>💬 피드백</h4>
          <div style="max-height:300px; overflow-y:auto;">
            ${Object.entries(feedbacks).map(([fbId, fb]) => `
              <div class="bubble player">
                <span><b>${p.name}:</b> ${fb.msg}</span>
                ${fb.replies ? `<div class="reply-box">${Object.values(fb.replies).map(r => `<div class="reply-item"><span class="reply-sender ${r.sender}">${r.sender}:</span><span class="reply-text">${r.text}</span></div>`).join('')}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
      }));

      container.innerHTML = cards.join('');
    }
  </script>
</body>

</html>
